<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naigos — live</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root { --panel:#0f151dEE; --line:#243347; --fg:#dbe6f3; --dim:#7d92ab;
          --red:#ff5a5a; --amber:#ffb648; --green:#45d17a; }
  html,body,#cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden;
       background:#000; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--fg); }
  #hud { position:absolute; top:12px; left:12px; width:310px; background:var(--panel);
         border:1px solid var(--line); border-radius:8px; padding:13px; backdrop-filter:blur(9px); }
  #replaybar { position:absolute; left:342px; right:12px; bottom:12px; display:flex; gap:10px;
               align-items:center; background:var(--panel); border:1px solid var(--line);
               border-radius:8px; padding:9px 13px; backdrop-filter:blur(9px); }
  #rp-scrub { flex:1; accent-color:#4da3ff; }
  #status { position:absolute; top:12px; right:12px; background:var(--panel);
            border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  h1 { font-size:13px; margin:0; letter-spacing:.06em; }
  .sub { color:var(--dim); font-size:11px; margin:2px 0 12px; }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim);
       margin:14px 0 6px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:1px 0; } td.k { color:var(--dim); } td.v { text-align:right; font-variant-numeric:tabular-nums; }
  .ac { display:flex; align-items:center; gap:6px; padding:2px 0; font-variant-numeric:tabular-nums; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .meter { flex:1; height:5px; background:#1b2534; border-radius:3px; overflow:hidden; }
  .meter > i { display:block; height:100%; background:var(--amber); transition:width .2s; }
  .tag { min-width:44px; text-align:right; font-size:11px; }
  .lost { color:var(--red); } .ok { color:var(--green); }
  .live { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green);
          margin-right:6px; animation:p 1.6s infinite; }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.25} }
  .note { color:var(--dim); font-size:10px; margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
  button { font:inherit; font-size:11px; background:#1a2432; color:var(--fg); border:1px solid var(--line);
           border-radius:5px; padding:4px 8px; cursor:pointer; }
  button.on { background:#4da3ff; border-color:#4da3ff; color:#04101d; font-weight:600; }
  .row { display:flex; gap:5px; flex-wrap:wrap; }
  button[disabled] { opacity:.45; cursor:not-allowed; }
  /* The visual-only banner. Deliberately not styleable away by a mode switch:
     it is hidden by exactly one thing, leaving photorealistic mode. */
  #visualonly { position:absolute; top:12px; left:342px; right:230px; z-index:5;
                background:#2a1a05EE; border:1px solid var(--amber); border-radius:8px;
                padding:9px 13px; backdrop-filter:blur(9px); pointer-events:none; }
  #visualonly .vo-title { color:var(--amber); font-weight:700; letter-spacing:.08em;
                          font-size:11px; text-transform:uppercase; }
  #visualonly .vo-body { font-size:11px; margin-top:3px; }
  #visualonly .vo-credit { color:var(--dim); font-size:10px; margin-top:4px; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="hud">
  <h1>NAIGOS <span style="color:var(--dim);font-weight:400" id="theatre"></span></h1>
  <div class="sub"><span class="live"></span><span id="rate"></span></div>

  <h2>Aircraft — worst track held on it</h2>
  <div id="aircraft"></div>

  <h2>Cumulative</h2>
  <table id="counters"></table>

  <h2>Layers</h2>
  <div class="row">
    <button id="t-lethal" class="on">lethal</button>
    <button id="t-detect">detection</button>
    <button id="t-trails" class="on">trails</button>
    <button id="t-los" class="on">LOS rays</button>
    <button id="t-xray">x-ray</button>
    <button id="t-exag">relief</button>
    <button id="t-shade" class="on">hillshade</button>
    <button id="t-imagery" class="on">imagery</button>
    <button id="t-follow">follow</button>
    <button id="t-photo">photoreal</button>
  </div>

  <div class="note" id="note"></div>
  <div class="note" id="terrainnote"></div>
  <div class="note" id="imagerynote"></div>
  <div class="note" id="visualnote"></div>
</div>

<!-- Shown for as long as, and only as long as, the photorealistic mode is on. -->
<div id="visualonly" hidden>
  <div class="vo-title" id="vo-title"></div>
  <div class="vo-body" id="vo-body"></div>
  <div class="vo-credit" id="vo-credit"></div>
</div>

<div id="status">t+<span id="clock">0</span> s sim</div>

<div id="replaybar" hidden>
  <button id="rp-play">&#9654; play</button>
  <input id="rp-scrub" type="range" min="0" value="0">
  <span id="rp-policies" class="row"></span>
</div>

<script>
// Two layers, deliberately separated, and this file never lets them touch.
//   IMAGERY  -- the skin. Sentinel-2 pixels. Cosmetic; the model never sees it.
//   TERRAIN  -- the physics. The simulation's own heightmap, served from
//               /terrain, and the surface every LOS ray was computed against.
// The token is injected by the server from the environment; it is never in this
// file or in the repository. See naigos/demo/imagery.py.
const ION_TOKEN = /*__ION_TOKEN__*/null;
const IMAGERY = /*__IMAGERY__*/{mode: "osm", osm_url: "https://tile.openstreetmap.org/"};
// The whole visual-provider contract (naigos.demo.imagery.VisualConfig.as_dict).
// IMAGERY above is the same contract narrowed to the base layer this file
// draws today; VISUAL additionally carries the mode, the 3D-tileset fields and
// evidence_grade. Credential-free by construction -- the token travels only
// through ION_TOKEN above, and only that one substitution point.
const VISUAL = /*__VISUAL__*/{mode: "physics", evidence_grade: true};
// Needed only on the tileset_route === "google_maps_api" path, where CesiumJS
// talks to Google's endpoint directly rather than through ion. Injected by the
// server from the environment, by its own substitution point, for the same
// reason ION_TOKEN has one: a credential travels by exactly one path, so
// grepping that path is enough to know where it can go.
const GOOGLE_API_KEY = /*__GOOGLE_API_KEY__*/null;

// LOD and request budget for the photorealistic tileset. CesiumJS's defaults
// assume the tileset owns the page: a 1.5 GB cache with 1 GB of overflow, and
// collision geometry. Here it is a backdrop on a page that is also holding an
// SSE stream open and stepping a simulation, so it gets a budget instead.
// maximumScreenSpaceError 16 is the library default, restated so it is a
// decision rather than an accident.
const PHOTO_LIMITS = {
  maximumScreenSpaceError: 16,
  cacheBytes: 512 * 1024 * 1024,
  maximumCacheOverflowBytes: 256 * 1024 * 1024,
  maximumRequestsPerServer: 12,
  // Revert to physics after this many tile failures. A provider that starts
  // failing mid-session must not leave a half-drawn backdrop on screen under a
  // banner implying there is something to look at.
  tileFailureBudget: 24,
};
const lethalDomes = [], detectRings = [];
if (ION_TOKEN) Cesium.Ion.defaultAccessToken = ION_TOKEN;

const AC_COLORS = [
  Cesium.Color.fromCssColorString("#4da3ff"),
  Cesium.Color.fromCssColorString("#45d17a"),
  Cesium.Color.fromCssColorString("#ffb648"),
  Cesium.Color.fromCssColorString("#c07fff"),
  Cesium.Color.fromCssColorString("#ff7ac0"),
  Cesium.Color.fromCssColorString("#5fe3d0"),
];

async function boot() {
  const scene = await (await fetch("/scene")).json();
  document.getElementById("theatre").textContent = "· " + scene.theatre;
  document.getElementById("rate").textContent =
    `live · ${scene.speed}× real time · ${scene.n_blue} aircraft · CBF ${scene.cbf ? "on" : "off"}`;
  document.getElementById("terrainnote").textContent =
    `Globe surface is the simulation's own heightmap (${scene.terrain.grid} @ `
    + `${scene.terrain.cell_m} m), not a stand-in — so what occludes on screen is what `
    + "occluded in the model. Red LOS ray = threat sees you; green = terrain is cutting it.";
  document.getElementById("note").textContent =
    "Threat sites are randomly spawned and parameterised — they model no real air-defence "
    + "disposition. Blue is purely evasive and carries no weapon. "
    + "Not measured: " + Object.keys(scene.assumptions).join(", ") + ".";

  // ---- terrain: the surface the SIMULATION used, not a stand-in -------------
  // /terrain serves the env's own heightmap resampled to a lat/lon grid (int16
  // metres). Feeding it through CustomHeightmapTerrainProvider means the globe
  // renders the exact surface every line-of-sight ray was computed against, so
  // the viewer demonstrates terrain masking instead of illustrating it.
  // Measured agreement with the env sampler: mean 1.65 m, max 37.5 m.
  const T = scene.terrain;
  const heights = new Int16Array(await (await fetch("/terrain")).arrayBuffer());
  const dLon = T.east - T.west, dLat = T.north - T.south;

  function sampleGrid(lonDeg, latDeg) {
    // Outside the modelled box the edge value is held for a short skirt and then
    // feathered to zero, so the AOI does not sit on a cliff. The drawn boundary
    // polyline is what keeps that honest.
    const u = (lonDeg - T.west) / dLon, v = (latDeg - T.south) / dLat;
    const cu = Math.min(Math.max(u, 0), 1), cv = Math.min(Math.max(v, 0), 1);
    const fx = cu * (T.nx - 1), fy = cv * (T.ny - 1);
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const x1 = Math.min(x0 + 1, T.nx - 1), y1 = Math.min(y0 + 1, T.ny - 1);
    const tx = fx - x0, ty = fy - y0;
    const a = heights[y0 * T.nx + x0], b2 = heights[y0 * T.nx + x1];
    const c = heights[y1 * T.nx + x0], d = heights[y1 * T.nx + x1];
    const h = (a * (1 - tx) + b2 * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;

    const over = Math.max(Math.abs(u - cu) * dLon, Math.abs(v - cv) * dLat);
    if (over === 0) return h;
    const SKIRT = 0.05, FEATHER = 0.25;           // degrees
    if (over <= SKIRT) return h;
    if (over >= SKIRT + FEATHER) return 0;
    return h * (1 - (over - SKIRT) / FEATHER);
  }

  // Cesium's verticalExaggeration scales the GLOBE MESH only -- not entity
  // altitudes. Mixing the two puts every aircraft kilometres inside the
  // mountain and makes occlusion unconditionally true, which inverts exactly
  // the claim this viewer exists to demonstrate. So every altitude in this file
  // goes through c3()/exagZ(), and exaggeration defaults to x1.
  let EXAG_K = 1.0;
  let hillshadeLayer = null;
  // Which surface is on screen. Declared here because applyDepthTest() below
  // reads it; "physics" until something deliberately changes it.
  let visualMode = "physics";
  const exagZ = (alt) => alt * EXAG_K;
  const c3 = (lon, lat, alt) => Cesium.Cartesian3.fromDegrees(lon, lat, exagZ(alt));

  const tilingScheme = new Cesium.GeographicTilingScheme();
  const TILE = 64;
  // Beyond the level where a tile's posts are finer than the served grid,
  // refining is pure interpolation at real cost -- and HeightmapTerrainData
  // claims four children forever, so nothing else stops it.
  const LMAX = 11;
  const terrainProvider = new Cesium.CustomHeightmapTerrainProvider({
    width: TILE, height: TILE, tilingScheme,
    credit: "Naigos simulation heightmap",
    callback: (x, y, level) => {
      const r = tilingScheme.tileXYToRectangle(x, y, level);   // radians
      const w = Cesium.Math.toDegrees(r.west), e = Cesium.Math.toDegrees(r.east);
      const s2 = Cesium.Math.toDegrees(r.south), n = Cesium.Math.toDegrees(r.north);
      const out = new Float32Array(TILE * TILE);
      for (let j = 0; j < TILE; j++) {
        // heightmap rows run north -> south, our grid runs south -> north
        const lat = n - (j / (TILE - 1)) * (n - s2);
        for (let i = 0; i < TILE; i++) {
          out[j * TILE + i] = sampleGrid(w + (i / (TILE - 1)) * (e - w), lat);
        }
      }
      return out;
    },
  });
  const _baseErr = terrainProvider.getLevelMaximumGeometricError.bind(terrainProvider);
  terrainProvider.getLevelMaximumGeometricError = (l) => (l >= LMAX ? 0 : _baseErr(l));

  // ---- imagery: the SKIN, and only the skin --------------------------------
  // Sentinel-2 (Cesium ion asset 3954) draped over the relief above. It is what
  // makes the scene read as real geography, and it is the one layer in this
  // viewer that carries no claim: the model never sees a pixel of it.
  //
  // Not Cesium's default base imagery. That is Bing Aerial -- third-party
  // commercial data, metered by session, under Microsoft's terms rather than
  // Cesium's. Sentinel-2 is ESA/Copernicus open data, so it is free to *use*
  // and not merely free to look at, which is the question a portfolio project
  // should not have to answer.
  const osmLayer = () => new Cesium.ImageryLayer(
    new Cesium.OpenStreetMapImageryProvider({ url: IMAGERY.osm_url }));

  let imageryCredit = IMAGERY.attribution;
  let baseLayer;
  if (IMAGERY.mode === "sentinel2") {
    try {
      // fromAssetId, not the constructor: the constructor form was removed in
      // CesiumJS 1.107 and silently yields a provider that never resolves.
      baseLayer = new Cesium.ImageryLayer(
        await Cesium.IonImageryProvider.fromAssetId(IMAGERY.ion_asset));
    } catch (e) {
      // A rejected token or an offline ion should degrade to a working globe,
      // not a black one -- the terrain, and every claim resting on it, is
      // unaffected by which imagery is draped over it.
      console.warn("Cesium ion Sentinel-2 unavailable; falling back to OSM", e);
      baseLayer = osmLayer();
      imageryCredit = IMAGERY.osm_attribution + " (Sentinel-2 unavailable)";
    }
  } else {
    baseLayer = osmLayer();
  }

  const opts = {
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, animation: false, timeline: false, infoBox: false,
    selectionIndicator: false, fullscreenButton: false,
    // The two layers enter the viewer through two different options, from two
    // different sources, and nothing downstream merges them.
    terrainProvider,   // physics: the simulation's DEM
    baseLayer,         // skin: Sentinel-2 (or OSM)
  };
  const viewer = new Cesium.Viewer("cesiumContainer", opts);
  // Cesium ion's Content Usage guide requires the provider attribution to be on
  // screen. CesiumJS emits it from the asset's own credit into the credit
  // display bottom-right, so that display stays visible on purpose; the HUD line
  // below restates it so a screenshot carries it too.
  // IMAGERY describes the base layer only, so this line always credits the
  // pixels actually under the cursor: OSM in photorealistic mode, where the
  // keyless layer is what shows through the tileset's edges. The tileset's own
  // credit belongs to the banner and to Cesium's credit display.
  document.getElementById("imagerynote").textContent =
    imageryCredit + " " + IMAGERY.separation_note;
  // CustomHeightmapTerrainProvider supplies no vertex normals, so Cesium cannot
  // light the surface at all -- the Alborz would render as a flat map under any
  // imagery. Derive a hillshade from the SAME height array (Horn gradient, sun NW
  // at 45 deg) and drape it over the imagery. Same source as the mesh, so the
  // shading cannot disagree with the geometry.
  (function addHillshade() {
    const cv = document.createElement("canvas");
    cv.width = T.nx; cv.height = T.ny;
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(T.nx, T.ny);
    const mPerDegLat = 111132.0;
    const mPerDegLon = 111320.0 * Math.cos(((T.south + T.north) / 2) * Math.PI / 180);
    const ex = (dLon / (T.nx - 1)) * mPerDegLon, ey = (dLat / (T.ny - 1)) * mPerDegLat;
    const az = (315 * Math.PI) / 180, alt = (45 * Math.PI) / 180;
    const at = (r, c) => heights[Math.min(Math.max(r, 0), T.ny - 1) * T.nx
                                + Math.min(Math.max(c, 0), T.nx - 1)];
    for (let r = 0; r < T.ny; r++) {
      for (let c = 0; c < T.nx; c++) {
        const dzdx = ((at(r - 1, c + 1) + 2 * at(r, c + 1) + at(r + 1, c + 1))
                    - (at(r - 1, c - 1) + 2 * at(r, c - 1) + at(r + 1, c - 1))) / (8 * ex);
        const dzdy = ((at(r + 1, c - 1) + 2 * at(r + 1, c) + at(r + 1, c + 1))
                    - (at(r - 1, c - 1) + 2 * at(r - 1, c) + at(r - 1, c + 1))) / (8 * ey);
        const slope = Math.atan(Math.hypot(dzdx, dzdy));
        const aspect = Math.atan2(dzdy, -dzdx);
        let v = Math.cos(alt) * Math.cos(slope)
              + Math.sin(alt) * Math.sin(slope) * Math.cos(az - aspect);
        v = Math.min(Math.max(v, 0), 1);
        // canvas row 0 is the image top = north; the grid's row 0 is south
        const o = ((T.ny - 1 - r) * T.nx + c) * 4;
        const g = Math.round(255 * v);
        img.data[o] = img.data[o + 1] = img.data[o + 2] = g;
        img.data[o + 3] = 150;
      }
    }
    ctx.putImageData(img, 0, 0);
    const layer = viewer.imageryLayers.addImageryProvider(
      new Cesium.SingleTileImageryProvider({
        url: cv.toDataURL(), tileWidth: T.nx, tileHeight: T.ny,
        rectangle: Cesium.Rectangle.fromDegrees(T.west, T.south, T.east, T.north),
      }));
    // Sentinel-2 already carries its own sun shading, so a heavy grey wash over
    // it destroys the imagery for no gain; OSM is flat line-work and needs the
    // relief cue much more.
    layer.alpha = IMAGERY.mode === "sentinel2" ? 0.32 : 0.55;
    hillshadeLayer = layer;
  })();

  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.scene.globe.showSkirts = true;
  viewer.scene.globe.maximumScreenSpaceError = 3;
  viewer.scene.skyAtmosphere.show = true;
  // Depth test ON by default so aircraft genuinely vanish behind ridges -- that
  // occlusion is the visual proof of the mechanic. The x-ray toggle lifts it.
  viewer.scene.minimumDisableDepthTestDistance = 0.0;

  // The edge of the modelled world, drawn rather than left as a mystery.
  viewer.entities.add({
    polyline: {
      positions: Cesium.Cartesian3.fromDegreesArray([
        T.west, T.south, T.east, T.south, T.east, T.north, T.west, T.north, T.west, T.south]),
      width: 1.5, clampToGround: true,
      material: new Cesium.PolylineDashMaterialProperty({
        color: Cesium.Color.fromCssColorString("#7d92ab").withAlpha(0.8) }),
    },
  });

  const b = scene.bounds;
  viewer.camera.flyTo({
    destination: Cesium.Rectangle.fromDegrees(b.west, b.south, b.east, b.north),
    duration: 0,
  });

  // ------------------------------------------------------------- threats
  // Rebuilt whenever the server re-draws the threat field, otherwise stale
  // envelopes stay painted over a map that no longer has those sites.
  const threatEntities = new Map();
  let lethalOn = true, detectOn = false;

  function clearThreats() {
    for (const e of threatEntities.values()) viewer.entities.remove(e);
    for (const e of lethalDomes) viewer.entities.remove(e);
    for (const e of detectRings) viewer.entities.remove(e);
    threatEntities.clear();
    lethalDomes.length = 0;
    detectRings.length = 0;
  }

  function buildThreats(scene) {
  for (const t of scene.threats) {
    if (!t.active) continue;
    const e = viewer.entities.add({
      position: c3(t.lon, t.lat, t.alt),
      point: { pixelSize: 9, color: Cesium.Color.fromCssColorString("#ff5a5a"),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 1,
               disableDepthTestDistance: Number.POSITIVE_INFINITY },
      label: { text: t.label.replace(/_/g, " "), font: "10px monospace",
               fillColor: Cesium.Color.fromCssColorString("#ff9d9d"),
               pixelOffset: new Cesium.Cartesian2(0, -16), scale: 0.9,
               disableDepthTestDistance: Number.POSITIVE_INFINITY,
               translucencyByDistance: new Cesium.NearFarScalar(3e4, 1.0, 2.5e5, 0.0) },
    });
    threatEntities.set(t.i, e);

    // Envelopes are altitude BANDS, not hemispheres: a half-height ellipsoid
    // squashed to the class's engagement ceiling is the honest shape.
    if (t.lethal_m > 0) {
      const h = Math.min(t.lethal_m, t.alt_max_m);
      lethalDomes.push(viewer.entities.add({
        position: c3(t.lon, t.lat, t.alt),
        ellipsoid: {
          radii: new Cesium.Cartesian3(t.lethal_m, t.lethal_m, h * EXAG_K),
          material: Cesium.Color.fromCssColorString("#ff3b3b").withAlpha(0.10),
          outline: true, outlineColor: Cesium.Color.fromCssColorString("#ff3b3b").withAlpha(0.35),
          outlineWidth: 1,
        },
      }));
      lethalDomes[lethalDomes.length - 1]._naigosH = h;   // unexaggerated, for rescaling
    }
    if (t.detect_m > 0) {
      const d = viewer.entities.add({
        position: c3(t.lon, t.lat, t.alt),
        ellipse: {
          semiMajorAxis: t.detect_m, semiMinorAxis: t.detect_m,
          material: Cesium.Color.fromCssColorString("#ffb648").withAlpha(0.05),
          outline: true, outlineColor: Cesium.Color.fromCssColorString("#ffb648").withAlpha(0.30),
          height: 0,
        },
        show: false,
      });
      detectRings.push(d);
    }
  }
  lethalDomes.forEach(e => (e.show = lethalOn));
  detectRings.forEach(e => (e.show = detectOn));
  }

  buildThreats(scene);

  // ------------------------------------------------------------ aircraft
  const craft = [], trails = [], trailPts = [], objMarks = [];
  const losLines = [], losPts = [], losBlocks = [], dropLines = [], dropPts = [];
  for (let i = 0; i < scene.n_blue; i++) {
    const col = AC_COLORS[i % AC_COLORS.length];
    trailPts.push([]);
    trails.push(viewer.entities.add({
      polyline: {
        positions: new Cesium.CallbackProperty(() => trailPts[i], false),
        width: 2, material: col.withAlpha(0.85), clampToGround: false,
      },
    }));
    craft.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(0, 0, 0),
      // No disableDepthTestDistance: the aircraft must be occluded by terrain.
      point: { pixelSize: 11, color: col, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 },
      label: { text: `${i}`, font: "bold 10px monospace", fillColor: Cesium.Color.BLACK,
               pixelOffset: new Cesium.Cartesian2(0, 1), scale: 0.85 },
      show: false,
    }));
    losPts.push([]);
    losLines.push(viewer.entities.add({
      polyline: {
        positions: new Cesium.CallbackProperty(() => losPts[i], false),
        width: 1.5, material: Cesium.Color.WHITE.withAlpha(0.5),
      },
      show: false,
    }));
    // Where the ray is pinched: the sample the minimum clearance came from.
    // Drawn only when that minimum is negative, i.e. terrain is cutting the
    // ray -- which is the one moment the overlay exists to make visible.
    losBlocks.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(0, 0, 0),
      point: { pixelSize: 8, color: Cesium.Color.fromCssColorString("#45d17a"),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               disableDepthTestDistance: Number.POSITIVE_INFINITY },
      label: { text: "blocked", font: "bold 9px monospace",
               fillColor: Cesium.Color.fromCssColorString("#45d17a"),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               style: Cesium.LabelStyle.FILL_AND_OUTLINE,
               pixelOffset: new Cesium.Cartesian2(0, -14), scale: 0.9,
               disableDepthTestDistance: Number.POSITIVE_INFINITY,
               translucencyByDistance: new Cesium.NearFarScalar(3e4, 1.0, 3.0e5, 0.0) },
      show: false,
    }));
    dropPts.push([]);
    dropLines.push(viewer.entities.add({
      polyline: {
        positions: new Cesium.CallbackProperty(() => dropPts[i], false),
        width: 1, material: col.withAlpha(0.35),
      },
      show: false,
    }));
    objMarks.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(0, 0, 0),
      point: { pixelSize: 7, color: Cesium.Color.fromCssColorString("#45d17a").withAlpha(0.8),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 1 },
      show: false,
    }));
  }

  // -------------------------------------------------------------- toggles
  const bindToggle = (id, get, set, arr) => {
    const btn = document.getElementById(id);
    const apply = () => { arr().forEach(e => (e.show = get())); btn.classList.toggle("on", get()); };
    btn.onclick = () => { set(!get()); apply(); };
    apply();
  };
  bindToggle("t-lethal", () => lethalOn, v => (lethalOn = v), () => lethalDomes);
  bindToggle("t-detect", () => detectOn, v => (detectOn = v), () => detectRings);
  let trailsOn = true;
  bindToggle("t-trails", () => trailsOn, v => (trailsOn = v), () => trails);
  // Not bindToggle: the block markers are gated on losOn AND on the ray being
  // cut, which drawAircraft re-decides every frame. Turning the layer off has
  // to hide them immediately rather than wait for the next frame to agree.
  let losOn = true;
  const losBtn = document.getElementById("t-los");
  const applyLos = () => {
    losLines.forEach(e => (e.show = losOn));
    if (!losOn) losBlocks.forEach(e => (e.show = false));
    losBtn.classList.toggle("on", losOn);
  };
  losBtn.onclick = () => { losOn = !losOn; applyLos(); };
  applyLos();

  // X-ray: one global knob. 0 = depth test on (aircraft hide behind ridges),
  // huge = always visible. Occlusion is the point, so it defaults to off.
  let xray = false;
  // Depth-testing the overlays against the terrain is the point in physics mode:
  // an aircraft that disappears behind a ridge disappeared in the model too.
  // Against the photorealistic mesh it would be the opposite -- an occlusion the
  // simulation never computed, drawn as though it had, by provider buildings
  // that exist in no model. So that mode never depth-tests, whatever x-ray says.
  const applyDepthTest = () => {
    viewer.scene.minimumDisableDepthTestDistance =
      (xray || visualMode === "photorealistic") ? Number.POSITIVE_INFINITY : 0.0;
  };
  const xrayBtn = document.getElementById("t-xray");
  xrayBtn.onclick = () => {
    xray = !xray;
    applyDepthTest();
    dropLines.forEach(e => (e.show = xray));
    xrayBtn.classList.toggle("on", xray);
  };

  // Vertical exaggeration -- 80 km of map against 3 km of relief reads flat from
  // orbit, and the whole point is to see the ridges.
  const shadeBtn = document.getElementById("t-shade");
  let shadeOn = true;
  shadeBtn.onclick = () => {
    shadeOn = !shadeOn;
    if (hillshadeLayer) hillshadeLayer.show = shadeOn;
    shadeBtn.classList.toggle("on", shadeOn);
  };

  // Turning the skin off leaves the relief, the hillshade and every LOS ray
  // exactly where they were -- which is the layer separation made clickable.
  const imgBtn = document.getElementById("t-imagery");
  let imageryOn = true;
  imgBtn.onclick = () => {
    imageryOn = !imageryOn;
    baseLayer.show = imageryOn;
    imgBtn.classList.toggle("on", imageryOn);
  };

  const exagBtn = document.getElementById("t-exag");
  const EXAG = [1, 2, 3];
  let exagIdx = 0;                       // x1: mesh and entities agree by default
  const applyExag = () => {
    EXAG_K = EXAG[exagIdx];
    viewer.scene.verticalExaggeration = EXAG_K;
    // trails and domes cache absolute positions, so they must be rebuilt
    trailPts.forEach((_, i) => (trailPts[i] = []));
    lethalDomes.forEach(d => {
      const r = d.ellipsoid.radii.getValue();
      d.ellipsoid.radii = new Cesium.Cartesian3(r.x, r.y, d._naigosH * EXAG_K);
    });
    exagBtn.textContent = `relief x${EXAG_K}`;
    exagBtn.classList.toggle("on", EXAG_K !== 1);
  };
  exagBtn.onclick = () => { exagIdx = (exagIdx + 1) % EXAG.length; applyExag(); };
  applyExag();
  let follow = false;
  document.getElementById("t-follow").onclick = e => {
    follow = !follow; e.target.classList.toggle("on", follow);
  };

  // ------------------------------------------------------- visual modes
  // Two postures, and never both at once.
  //
  //   physics terrain         the globe: the simulation's own heightmap over
  //                           /terrain, skinned with Sentinel-2 or OSM. The
  //                           surface every line-of-sight ray was computed
  //                           against, and the only one that is evidence.
  //   photorealistic context  Google Photorealistic 3D Tiles: the provider's
  //                           own geometry -- ground, buildings, trees -- none
  //                           of which the simulation has ever seen.
  //
  // Entering photorealistic switches the globe OFF. That avoids z-fighting
  // between two surfaces a few metres apart, but the reason is the stronger
  // one: two surfaces on screen is two competing claims about the same ground,
  // and the prettier one is the one that is not evidence. Exactly one surface
  // is drawn at a time, so there is nothing to mistake for the other.
  //
  // Physics is the fallback in every direction. It is what the page boots into
  // unless the server resolved photorealistic; what a provider failure returns
  // to; and what the toggle always leads back to.
  //
  // Nothing in this block touches craft, trails, threatEntities, losLines or
  // the counters. The overlays are entities in world space and are drawn the
  // same way in both modes -- only the surface under them changes.
  const PHOTO = VISUAL.mode === "photorealistic";
  const photoBtn = document.getElementById("t-photo");
  const visualNote = document.getElementById("visualnote");
  const banner = document.getElementById("visualonly");
  const terrainNote = document.getElementById("terrainnote");
  // The physics-mode wording, captured before anything can overwrite it: in
  // photorealistic mode it is false, and it has to come back verbatim.
  const PHYSICS_TERRAIN_NOTE = terrainNote.textContent;
  const VISUAL_ONLY_TITLE = "Visual only — photorealistic context";
  const VISUAL_ONLY_BODY = VISUAL.separation_note
    || "PRESENTATION MODE. The surface drawn is the provider's, not the simulation's DEM.";
  document.getElementById("vo-title").textContent = VISUAL_ONLY_TITLE;
  document.getElementById("vo-body").textContent = VISUAL_ONLY_BODY;
  // Google's terms require their attribution and the per-tile data credits to be
  // on screen while the tiles are drawn. Cesium's credit display carries the
  // authoritative per-tile version (showCreditsOnScreen below puts them there
  // rather than behind a popup) and is never suppressed; this is the static
  // restatement, so a screenshot of the banner carries it too.
  document.getElementById("vo-credit").textContent = VISUAL.attribution || "";
  // Buttons that act on the globe, and mean nothing once the globe is off.
  const globeOnlyButtons = [exagBtn, shadeBtn, imgBtn];

  let tileset = null, tileFailures = 0;
  const DEFAULT_REQUESTS_PER_SERVER = Cesium.RequestScheduler.maximumRequestsPerServer;

  function showPhysicsTerrain(reason) {
    visualMode = "physics";
    if (tileset) tileset.show = false;
    viewer.scene.globe.show = true;
    Cesium.RequestScheduler.maximumRequestsPerServer = DEFAULT_REQUESTS_PER_SERVER;
    applyDepthTest();
    banner.hidden = true;
    terrainNote.textContent = PHYSICS_TERRAIN_NOTE;
    globeOnlyButtons.forEach(b => (b.disabled = false));
    photoBtn.classList.remove("on");
    photoBtn.textContent = "photoreal";
    if (reason) visualNote.textContent = reason;
  }

  async function showPhotorealisticContext() {
    if (!PHOTO || visualMode === "photorealistic") return;
    photoBtn.disabled = true;
    photoBtn.textContent = "loading…";
    try {
      if (!tileset) {
        // The viewer ships no geocoder at all (geocoder:false above), so the
        // Google-geocoder-only restriction on these tiles is met vacuously;
        // the flag says so and silences the one-time warning.
        const apiOptions = { onlyUsingWithGoogleGeocoder: true };
        // With no key CesiumJS reaches the same tileset through Cesium ion,
        // which the ion token already covers. The key is only for the direct
        // route, and is never set globally.
        if (VISUAL.tileset_route === "google_maps_api" && GOOGLE_API_KEY) {
          apiOptions.key = GOOGLE_API_KEY;
        }
        tileset = await Cesium.createGooglePhotorealistic3DTileset(apiOptions, {
          maximumScreenSpaceError: PHOTO_LIMITS.maximumScreenSpaceError,
          cacheBytes: PHOTO_LIMITS.cacheBytes,
          maximumCacheOverflowBytes: PHOTO_LIMITS.maximumCacheOverflowBytes,
          // Nothing here picks against the mesh or drives on it, and collision
          // geometry is memory spent on a claim this mode refuses to make.
          enableCollision: false,
          showCreditsOnScreen: true,
        });
        tileset.tileFailed.addEventListener(() => {
          tileFailures += 1;
          if (visualMode !== "photorealistic" || tileFailures < PHOTO_LIMITS.tileFailureBudget) return;
          showPhysicsTerrain(
            `Photorealistic context failed after ${tileFailures} tile errors — back on `
            + "physics terrain, which needs no provider.");
        });
        viewer.scene.primitives.add(tileset);
      }
      tileset.show = true;
    } catch (e) {
      // A rejected key, an offline provider or a quota refusal must land on the
      // mode whose surface is the modelled one, not on a blank globe.
      console.warn("photorealistic context unavailable; staying on physics terrain", e);
      tileset = null;
      showPhysicsTerrain("Photorealistic context unavailable (" + e + ") — physics terrain kept.");
      photoBtn.disabled = true;
      photoBtn.textContent = "photoreal n/a";
      return;
    }
    visualMode = "photorealistic";
    // One surface at a time: the globe goes, and the modelled relief, its
    // imagery and its hillshade go with it.
    viewer.scene.globe.show = false;
    // Entity altitudes go through exagZ(); the tileset is unexaggerated, so a
    // relief multiplier here would float every aircraft above a mesh that never
    // moved. Back to x1 while this mode is on.
    if (EXAG_K !== 1) { exagIdx = 0; applyExag(); }
    globeOnlyButtons.forEach(b => (b.disabled = true));
    Cesium.RequestScheduler.maximumRequestsPerServer = PHOTO_LIMITS.maximumRequestsPerServer;
    applyDepthTest();
    banner.hidden = false;
    terrainNote.textContent = VISUAL_ONLY_BODY;
    photoBtn.disabled = false;
    photoBtn.classList.add("on");
    photoBtn.textContent = "physics terrain";
  }

  photoBtn.onclick = () => {
    if (visualMode === "photorealistic") showPhysicsTerrain(
      "Back on physics terrain: the globe is the simulation's own heightmap again.");
    else showPhotorealisticContext();
  };

  showPhysicsTerrain();
  if (PHOTO) {
    showPhotorealisticContext();
  } else {
    photoBtn.disabled = true;
    photoBtn.title = VISUAL.fallback_reason
      || "start the server with --visual photorealistic for the photorealistic context mode";
    if (VISUAL.fallback_reason) visualNote.textContent = VISUAL.fallback_reason;
  }

  // --------------------------------------------------------------- stream
  const MAX_TRAIL = 900;
  let drawId = 1;

  // ---- one renderer, both modes -------------------------------------------
  // Live frames and recorded frames carry the same aircraft shape, so the draw
  // path is shared. Only the fields a recording cannot have (tracker ray,
  // objective marker, retask flag) are guarded.
  function drawAircraft(aircraft, isReplay) {
    let html = "";
    for (const a of aircraft) {
      const c = craft[a.id], col = AC_COLORS[a.id % AC_COLORS.length];
      const pos = c3(a.lon, a.lat, a.alt);
      c.position = pos;
      c.show = a.alive;
      // A re-tasked aircraft teleports to the start line; carrying its old trail
      // across the map would draw a route it never flew.
      if (a.retasked) trailPts[a.id] = [];
      if (a.alive) {
        trailPts[a.id].push(pos);
        if (trailPts[a.id].length > MAX_TRAIL) trailPts[a.id].shift();
      }
      c.point.color = a.lock > 0.6 ? Cesium.Color.fromCssColorString("#ff5a5a")
                    : a.lock > 0.25 ? Cesium.Color.fromCssColorString("#ffb648") : col;

      if (a.objective) {
        // objective z comes from the frame; at height 0 it sat ~1200 m under
        // the Tehran basin floor once real terrain arrived.
        objMarks[a.id].position = c3(a.objective[0], a.objective[1], a.objective[2] ?? 0);
        objMarks[a.id].show = a.alive;
      }

      // Ray to the strongest tracker, coloured by terrain clearance. Negative
      // clearance means a ridge is cutting it -- the aircraft is masked, and you
      // watch the line vanish into the hillside.
      // Drawn whenever a threat has any look at all -- including a blocked one,
      // which is the whole point: a green ray sinking into a ridge is the
      // mechanic made visible.
      // The ray is drawn as the SAMPLED, REFRACTED curve the model marched --
      // a.los.pts, straight from naigos.demo.los -- and never as a two-point
      // line between the emitter and the aircraft. The model drops every sample
      // for 4/3-earth refraction (~100 m at the midpoint of an 80 km ray), so a
      // straight line clears ridges the model says it does not: the picture
      // would contradict the clearance printed beside it. next-steps E-13.
      const ray = a.los;
      if (!isReplay && a.alive && ray && ray.pts && ray.pts.length > 1) {
        losPts[a.id] = ray.pts.map(p => c3(p[0], p[1], p[2]));
        // Three bands, keyed to los_clearance_scale = 60 m, because visibility()
        // is a sigmoid rather than a step and grazing is where the tactic lives.
        // The band comes from the server so the colour cannot drift from the
        // number: naigos.demo.los.band owns the thresholds.
        losLines[a.id].polyline.material =
          ray.band === "masked"  ? Cesium.Color.fromCssColorString("#45d17a").withAlpha(0.5)
        : ray.band === "grazing" ? Cesium.Color.fromCssColorString("#ffb648").withAlpha(0.6)
                                 : Cesium.Color.fromCssColorString("#ff5a5a").withAlpha(0.6);
        losLines[a.id].show = losOn;
        // The pinch point, marked only while the ray is genuinely cut. A marker
        // on every ray would say nothing; on a blocked one it says exactly where
        // the terrain wins.
        if (ray.blocked && ray.pinch) {
          losBlocks[a.id].position = c3(ray.pinch[0], ray.pinch[1], ray.pinch[2]);
          losBlocks[a.id].label.text = `blocked ${Math.round(-ray.clearance)} m`;
          losBlocks[a.id].show = losOn;
        } else {
          losBlocks[a.id].show = false;
        }
      } else {
        losLines[a.id].show = false;
        losBlocks[a.id].show = false;
      }
      dropPts[a.id] = a.alive
        ? [pos, c3(a.lon, a.lat, a.alt - a.agl)] : [];
      dropLines[a.id].show = xray && a.alive;

      const tag = !a.alive ? '<span class="lost">lost</span>'
                : a.reached ? '<span class="ok">arrived</span>'
                : `${(a.lock * 100).toFixed(0)}%`;
      html += `<div class="ac"><span class="dot" style="background:${col.toCssColorString()}"></span>
        <span class="meter"><i style="width:${(a.alive ? a.lock * 100 : 0).toFixed(0)}%"></i></span>
        <span class="tag">${tag}</span></div>`;
    }
    document.getElementById("aircraft").innerHTML = html;

    if (follow) {
      const alive = aircraft.filter(a => a.alive);
      if (alive.length) {
        const a = alive[0];
        viewer.camera.lookAt(
          c3(a.lon, a.lat, a.alt),
          new Cesium.HeadingPitchRange(Cesium.Math.toRadians((a.heading ?? 0) - 180), -0.45, 22000));
      }
    } else {
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    }
  }

  function renderCounters(c, isReplay) {
    const rows = isReplay
      ? [["sorties surviving", (c.survival_rate ?? 0).toFixed(3)],
         ["objectives reached", (c.objective_rate ?? 0).toFixed(3)],
         ["shootdowns", c.shootdowns ?? "—"],
         ["terrain losses", c.terrain_losses ?? "—"],
         ["out of bounds", c.bounds_losses ?? "—"],
         ["mean detection prob", (c.mean_detection_prob ?? 0).toFixed(3)]]
      : [["sorties launched", c.sorties_launched],
         ["objectives reached", c.objectives_reached],
         ["shot down", c.shot_down],
         ["terrain losses", c.terrain_losses],
         ["out of bounds", c.bounds_losses],
         ["success rate", c.success_rate ?? "—"],
         ["threat draws", c.threat_draws]];
    document.getElementById("counters").innerHTML =
      rows.map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("");
  }

  // ---- replay mode: same renderer, frames from a file instead of a socket ----
  if (scene.mode === "replay") {
    const rp = await (await fetch("/frames")).json();
    let policy = rp.policies.includes("trained") ? "trained" : rp.policies[0];
    let frame = 0, playing = false;
    const bar = document.getElementById("replaybar");
    bar.hidden = false;
    const scrub = document.getElementById("rp-scrub");
    scrub.max = rp.frames[policy].length - 1;
    const playBtn = document.getElementById("rp-play");

    const polBox = document.getElementById("rp-policies");
    const LBL = { untrained: "untrained", trained: "TRAINED",
                  direct_route_baseline: "direct route", avoid_nap_baseline: "avoid+nap" };
    rp.policies.forEach(pn => {
      const btn = document.createElement("button");
      btn.textContent = LBL[pn] || pn;
      btn.onclick = () => {
        policy = pn;
        [...polBox.children].forEach(c => c.classList.toggle("on", c === btn));
        trailPts.forEach((_, i) => (trailPts[i] = []));
        render();
      };
      if (pn === policy) btn.classList.add("on");
      polBox.appendChild(btn);
    });

    const render = () => {
      const acs = rp.frames[policy][frame];
      document.getElementById("clock").textContent = (frame * rp.dt_s).toFixed(0);
      scrub.value = frame;
      drawAircraft(acs, /* replay */ true);
      renderCounters(rp.summaries[policy] || {}, true);
    };
    playBtn.onclick = () => {
      playing = !playing;
      playBtn.innerHTML = playing ? "&#10074;&#10074; pause" : "&#9654; play";
    };
    scrub.oninput = () => { frame = +scrub.value; playing = false;
                            playBtn.innerHTML = "&#9654; play"; render(); };
    setInterval(() => {
      if (!playing) return;
      frame = Math.min(frame + 1, rp.frames[policy].length - 1);
      if (frame === rp.frames[policy].length - 1) {
        playing = false; playBtn.innerHTML = "&#9654; play";
      }
      render();
    }, 60);
    render();
    return;
  }

  const es = new EventSource("/stream");
  es.onmessage = async ev => {
    const f = JSON.parse(ev.data);
    if (f.threat_draw && f.threat_draw !== drawId) {
      drawId = f.threat_draw;
      clearThreats();
      buildThreats(await (await fetch("/scene")).json());
      trailPts.forEach((_, i) => (trailPts[i] = []));
    }
    document.getElementById("clock").textContent = f.t.toFixed(0);
    for (const t of f.threats) {
      const e = threatEntities.get(t.i);
      if (e) e.position = c3(t.lon, t.lat, t.alt);
    }
    drawAircraft(f.aircraft, false);
    renderCounters(f.counters, false);
  };
  es.onerror = () => { document.getElementById("rate").textContent = "stream disconnected"; };
}

boot().catch(e => {
  document.body.insertAdjacentHTML("afterbegin",
    `<pre style="position:absolute;z-index:9;color:#ff8a8a;padding:16px">${e}</pre>`);
  console.error(e);
});
</script>
</body>
</html>
