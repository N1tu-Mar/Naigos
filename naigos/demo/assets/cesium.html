      viewer.trackedEntity = follow && !SAFE_FOLLOW
        ? craft.find(c => c.isAvailable(viewer.clock.currentTime)) : undefined;
    }
  };

  // A preset chosen on the command line can be the chase view; it needs the
  // aircraft, which exist from here on.
  if (CAM.default === "follow_aircraft") setCameraMode("follow_aircraft");

  // --------------------------------------------------------------- city layer
  // --visual urban-presentation, local path: OpenStreetMap building footprints
  // extruded over the SIMULATION's DEM, and major-road centrelines draped on
  // it. Presentation only. naigos/demo/urban.py builds the payload; this block
  // draws it and reports what it drew.
  //
  //   Base height   the lowest sampleGrid() height under the footprint -- the
  //                 very surface the terrain provider draws, never sea level --
  //                 and the roof that building's height above its highest
  //                 corner.
  //   Occlusion     OFF by default. Buildings are see-through and every marker
  //                 is drawn on top, so a building can never hide an aircraft
  //                 and read as a blocked radar line. The toggle turns on a
  //                 RENDER-ONLY occlusion and says so while it is on.
  //   Budget        URBAN_LIMITS above: an initial cap, proximity loading,
  //                 distance culling, sliced main-thread work.
  //
  // The provider path (Google tiles) is the visual-modes block below; this
  // layer steps aside while provider tiles are on screen and comes back if
  // they fail. Nothing here reaches the simulation, and the simulation has no
  // route by which it could read it.
  const URBAN = VISUAL.mode === "urban-presentation";
  const urbanPanel = document.getElementById("urbanpanel");
  const urbanStatusEl = document.getElementById("urbanstatus");
  const urbanNote = document.getElementById("urbannote");
  const providerStatusEl = document.getElementById("providerstatus");
  const cityBanner = document.getElementById("citybanner");
  // Filled from the tileset's own events in showPhotorealisticContext().
  const providerProbe = { requested: !!VISUAL.tileset, urban: URBAN, created: false, shown: false,
                          failed: false, reason: null, tilesLoaded: 0, tilesVisible: 0, failures: 0 };
  const URBAN_SUMMARY = scene.urban || {};
  const city = {
    data: null, reason: null,
    buildingsOn: true, roadsOn: true,
    occlusion: VISUAL.building_occlusion_default === true,
    active: false, cap: URBAN_LIMITS.initialBuildings,
    loaded: new Map(), queue: [], busy: false,
    buildingsLoaded: 0, roadsLoaded: 0, skipped: 0,
  };
  if (URBAN && VISUAL.local_urban_state === "available") {
    // getRoute: the served /urban, or the copy embedded in a static export.
    // Never the network for data -- there is no OSM request in this page.
    try {
      const d = await getRoute("/urban");
      if (!d || d.schema !== URBAN_SCHEMA || !Array.isArray(d.chunks) || !d.chunks.length) {
        city.reason = "urban data unavailable: the local layer is missing or not " + URBAN_SCHEMA;
      } else {
        city.data = d;
      }
    } catch (e) {
      city.reason = "urban data unavailable: the local layer did not load (" + e + ")";
    }
  } else if (URBAN) {
    city.reason = URBAN_SUMMARY.reason || VISUAL.fallback_reason || "urban data unavailable";
  }
  const cityTotal = city.data ? city.data.counts.buildings : 0;

  // The theatre's palette (URBAN_THEMES above). Local extrusions only: the
  // provider path below never reads THEME.
  const THEME_KEY = urbanThemeKey(city.data && city.data.aoi, scene.theatre);
  const THEME = urbanTheme(THEME_KEY);
  // Under the city, OpenStreetMap's cartography (bright fills, labels) reads as
  // a paper map and competes with the buildings standing on it. In this mode
  // the base layer is toned down so the ground reads as ground and the
  // coloured masses read against it: the same pixels, the same credit, less
  // saturation and a little less light.
  if (URBAN && IMAGERY.mode === "osm") {
    baseLayer.saturation = THEME.ground.saturation;
    baseLayer.brightness = THEME.ground.brightness;
    baseLayer.contrast = THEME.ground.contrast;
  }
  const BUILDING_VERTEX_FORMAT = Cesium.PerInstanceColorAppearance.VERTEX_FORMAT;
  const ROADS = roadStyles(THEME);
  const rgba = a => new Cesium.Color(a[0], a[1], a[2], a[3]);
  const ROAD_STYLE = [
    { w: ROADS[0].w, c: rgba(ROADS[0].rgba) },   // motorway, trunk
    { w: ROADS[1].w, c: rgba(ROADS[1].rgba) },   // primary, secondary
    { w: ROADS[2].w, c: rgba(ROADS[2].rgba) },   // tertiary
    { w: ROADS[3].w, c: rgba(ROADS[3].rgba) },   // residential (opt-in per city)
  ];
  // Per-building colour, lit by the scene's one sun, roofs tinted toward the
  // theme's roof tone (roofShaders) so roof and wall read as different faces.
  // Alpha rides the instance colour; `translucent` decides whether it blends.
  // Occlusion off: blended, see-through. On: opaque pass, alpha ignored.
  let ROOF_SHADER = null;
  if (URBAN && city.data) {
    try {
      const stock = new Cesium.PerInstanceColorAppearance({ flat: false, closed: true });
      ROOF_SHADER = roofShaders(stock.vertexShaderSource, stock.fragmentShaderSource,
                                hexRgb(THEME.roof), THEME.roofMix, URBAN_THEME_RULES.wallShade);
    } catch (e) {
      ROOF_SHADER = null;
    }
  }
  const buildingAppearance = () => new Cesium.PerInstanceColorAppearance({
    flat: false,
    translucent: !city.occlusion,
    closed: true,          // back faces culled: no inner walls through a see-through roof
    vertexShaderSource: ROOF_SHADER ? ROOF_SHADER.vs : undefined,
    fragmentShaderSource: ROOF_SHADER ? ROOF_SHADER.fs : undefined,
  });

  function buildChunk(ci) {
    const ch = city.data.chunks[ci];
    const o = city.data.origin, q = city.data.quantum_deg;
    const inst = [];
    for (const rec of ch.b) {
      const ll = decodeCoords(rec, 1, o, q);
      let gmin = Infinity, gmax = -Infinity;
      for (let k = 0; k < ll.length; k += 2) {
        const g = sampleGrid(ll[k], ll[k + 1]);
        if (g < gmin) gmin = g;
        if (g > gmax) gmax = g;
      }
      const c = buildingColor(THEME, rec);
      try {
        inst.push(new Cesium.GeometryInstance({
          geometry: new Cesium.PolygonGeometry({
            polygonHierarchy: new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(ll)),
            height: gmin - URBAN_LIMITS.footingM,
            extrudedHeight: gmax + rec[0] / 10,
            closeBottom: false,
            vertexFormat: BUILDING_VERTEX_FORMAT,
          }),
          attributes: { color: new Cesium.ColorGeometryInstanceAttribute(
            c[0] / 255, c[1] / 255, c[2] / 255, URBAN_LIMITS.seeThroughAlpha) },
        }));
      } catch (e) {
        city.skipped += 1;
      }
    }
    const roads = ch.r.map(rec => new Cesium.GeometryInstance({
      geometry: new Cesium.GroundPolylineGeometry({
        positions: Cesium.Cartesian3.fromDegreesArray(decodeCoords(rec, 1, o, q)),
        width: ROAD_STYLE[rec[0]].w,
      }),
      attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(ROAD_STYLE[rec[0]].c) },
    }));
    const rec = {
      n: inst.length, nr: roads.length, near: true,
      b: inst.length ? viewer.scene.primitives.add(new Cesium.Primitive({
        geometryInstances: inst, appearance: buildingAppearance(), asynchronous: true,
        releaseGeometryInstances: true, allowPicking: false, shadows: Cesium.ShadowMode.DISABLED,
      })) : null,
      // Draped on the drawn terrain (and only the terrain), so a road never
      // floats off a slope or paints itself across a roof.
      r: roads.length ? viewer.scene.primitives.add(new Cesium.GroundPolylinePrimitive({
        geometryInstances: roads, appearance: new Cesium.PolylineColorAppearance(),
        asynchronous: true, releaseGeometryInstances: true, allowPicking: false,
        classificationType: Cesium.ClassificationType.TERRAIN,
      })) : null,
    };
    city.loaded.set(ci, rec);
    city.buildingsLoaded += rec.n;
    city.roadsLoaded += rec.nr;
    showChunk(rec);
    return Math.max(1, ch.b.length);
  }

  function showChunk(rec) {
    if (rec.b) rec.b.show = city.active && city.buildingsOn && rec.near;
    if (rec.r) rec.r.show = city.active && city.roadsOn && rec.near;
  }

  // Ground point under the screen centre, and the camera's height above the
  // DEM there -- what loading and culling are measured from.
  function cityFocus() {
    const cv = viewer.scene.canvas;
    const ray = viewer.camera.getPickRay(new Cesium.Cartesian2(cv.clientWidth / 2, cv.clientHeight / 2));
    const hit = ray ? viewer.scene.globe.pick(ray, viewer.scene) : undefined;
    const cam = viewer.camera.positionCartographic;
    const c = hit ? Cesium.Cartographic.fromCartesian(hit) : cam;
    const lon = Cesium.Math.toDegrees(c.longitude), lat = Cesium.Math.toDegrees(c.latitude);
    const agl = Math.max(0, cam.height - sampleGrid(Cesium.Math.toDegrees(cam.longitude),
                                                    Cesium.Math.toDegrees(cam.latitude)));
    return { lon, lat, agl };
  }

  function refreshCity() {
    if (!city.data || !city.active) return;
    const f = cityFocus();
    const cull = Math.max(URBAN_LIMITS.cullRadiusM, 3 * f.agl);
    for (const [ci, rec] of city.loaded) {
      rec.near = chunkDistanceM(city.data.chunks[ci], f.lon, f.lat) <= cull;
      showChunk(rec);
    }
    city.queue = planChunks(city.data.chunks, f.lon, f.lat, city.loaded, city.buildingsLoaded,
                            city.cap, Math.max(URBAN_LIMITS.loadRadiusM, 1.5 * f.agl));
    pumpCity();
  }

  function pumpCity() {
    if (city.busy) return;
    city.busy = true;
    const step = () => {
      let budget = URBAN_LIMITS.sliceBuildings;
      while (city.queue.length && budget > 0 && city.buildingsLoaded < city.cap) {
        const ci = city.queue.shift();
        if (!city.loaded.has(ci)) budget -= buildChunk(ci);
      }
      if (city.queue.length && city.buildingsLoaded < city.cap) setTimeout(step, 0);
      else city.busy = false;
    };
    setTimeout(step, 0);
  }

  // Measured, for the handoff's performance numbers: page-relative
  // milliseconds until the first footprints and the whole initial batch are
  // built and drawable.
  const cityTiming = { first_ready_ms: null, initial_ready_ms: null };
  function cityCounts() {
    let ready = 0, shown = 0, roadsShown = 0;
    for (const rec of city.loaded.values()) {
      if (rec.b && rec.b.ready) { ready += rec.n; if (rec.b.show) shown += rec.n; }
      if (rec.r && rec.r.ready && rec.r.show) roadsShown += rec.nr;
    }
    const now = pageClockMs();
    if (ready > 0 && cityTiming.first_ready_ms === null) cityTiming.first_ready_ms = now;
    if (ready > 0 && ready >= Math.min(URBAN_LIMITS.initialBuildings, cityTotal) * 0.98
        && cityTiming.initial_ready_ms === null) cityTiming.initial_ready_ms = now;
    return { ready, shown, roadsShown };
  }

  const fmt = n => n.toLocaleString("en-US");
  function renderCityStatus() {
    const prov = providerStatus(providerProbe);
    const cc = cityCounts();
    const active = urbanGeometryActive(prov, city.active && cc.shown > 0);
    if (PROVIDER_PAGE) {
      providerStatusEl.hidden = false;
      providerStatusEl.textContent = `Provider geometry: ${prov.label}`
        + (providerProbe.created ? ` · ${fmt(providerProbe.tilesLoaded)} tiles loaded` : "")
        + (providerProbe.failures ? ` · ${providerProbe.failures} tile errors` : "");
    }
    if (!URBAN) return;
    let html;
    if (active === "provider_3d_tiles") {
      html = `<span class="okc">provider buildings active</span> — Google Photorealistic 3D Tiles`;
    } else if (active === "local_osm_extrusions") {
      html = `<span class="okc">local OSM buildings</span> · ${fmt(cc.shown)} of ${fmt(cityTotal)} drawn`
        + ` · ${fmt(cc.roadsShown)} road pieces`
        + (prov.state !== "not_requested" ? ` · provider: ${prov.label}` : "");
    } else if (city.data && city.active) {
      html = `building the local city layer… ${fmt(city.buildingsLoaded)} of ${fmt(cityTotal)} queued`;
    } else if (prov.state === "loading" || prov.state === "hidden") {
      html = `${prov.label}` + (city.data ? " · local OSM layer standing by" : "");
    } else {
      html = `<span class="warn">URBAN DATA UNAVAILABLE</span> — no buildings are drawn. `
        + escHtml(city.reason || prov.label);
    }
    urbanStatusEl.innerHTML = html;
  }
  const escHtml = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

  // Called by both surface switches in the visual-modes block, after they have
  // done their own work: the city layer follows the surface, never the reverse.
  function citySurfaceChanged() {
    if (!URBAN) return;
    const onDem = visualMode !== "photorealistic";
    city.active = !!city.data && onDem;
    for (const rec of city.loaded.values()) showChunk(rec);
    urbanOverlaysOnTop = city.active && !city.occlusion;
    applyDepthTest();
    if (city.active) {
      // Buildings stand on the x1 surface; a relief multiplier would bury or
      // float every one of them. Off for as long as the layer is drawn.
      if (EXAG_K !== 1) { exagIdx = 0; applyExag(); }
      exagBtn.disabled = true;
      exagBtn.title = "relief multiplier is off while the city layer is drawn: buildings stand on the x1 surface";
    }
    cityBanner.hidden = !onDem;
    document.getElementById("cb-title").textContent = city.data
      ? "Visual only — urban presentation (local OpenStreetMap buildings)"
      : "Visual only — urban presentation · urban data unavailable";
    document.getElementById("cb-body").textContent = city.data
      ? (VISUAL.local_urban_note || VISUAL.separation_note)
      : (VISUAL.urban_unavailable_note || VISUAL.separation_note);
    document.getElementById("cb-credit").textContent = city.data
      ? `${VISUAL.base_attribution} ${URBAN_SUMMARY.attribution || ""} · cache ${city.data.cache_id}`
      : (VISUAL.base_attribution || "");
    if (onDem) {
      terrainNote.textContent = PHYSICS_TERRAIN_NOTE_CITY + " " + (VISUAL.building_note || "");
    }
    refreshCity();
    renderCityStatus();
  }
  const terrainNote0 = document.getElementById("terrainnote");
  const PHYSICS_TERRAIN_NOTE_CITY = terrainNote0.textContent.replace(
    "so what occludes on screen is what occluded in the model",
    "so the ground on screen is the ground the model used");
  const PROVIDER_PAGE = !!VISUAL.tileset;

  if (URBAN) {
    urbanPanel.hidden = false;
    const heightNote = city.data ? ` Heights: ${city.data.height_rule.order.join("; then ")}.` : "";
    const writeUrbanNote = () => {
      urbanNote.textContent = (VISUAL.building_note || "") + (city.occlusion
        ? " RENDER-ONLY building occlusion is ON: buildings are opaque and may hide aircraft on "
          + "screen. The simulation never saw a building -- nothing hidden here was hidden from a sensor."
        : " Building occlusion is render-only and off: buildings are see-through and every "
          + "marker is drawn on top, so no building can read as a blocked radar line.") + heightNote;
    };
    writeUrbanNote();
    const bBtn = document.getElementById("t-buildings");
    const rBtn = document.getElementById("t-roads");
    const oBtn = document.getElementById("t-occlusion");
    for (const b of [bBtn, rBtn, oBtn]) b.disabled = !city.data;
    bBtn.onclick = () => {
      city.buildingsOn = !city.buildingsOn; bBtn.classList.toggle("on", city.buildingsOn);
      for (const rec of city.loaded.values()) showChunk(rec);
    };
    rBtn.onclick = () => {
      city.roadsOn = !city.roadsOn; rBtn.classList.toggle("on", city.roadsOn);
      for (const rec of city.loaded.values()) showChunk(rec);
    };
    const markOcclusion = () => {
      oBtn.classList.toggle("on", city.occlusion);
      oBtn.textContent = city.occlusion ? "building occlusion: ON (render-only)" : "building occlusion: off";
      oBtn.title = city.occlusion
        ? "Buildings are opaque and may hide aircraft ON SCREEN. This is render-only: the simulation "
          + "never saw a building, and no LOS or detection result used one."
        : "Buildings are see-through and markers draw on top: nothing is hidden by a building.";
    };
    oBtn.onclick = () => {
      city.occlusion = !city.occlusion;
      for (const rec of city.loaded.values()) if (rec.b) rec.b.appearance = buildingAppearance();
      urbanOverlaysOnTop = city.active && !city.occlusion;
      applyDepthTest();
      markOcclusion();
      writeUrbanNote();
      urbanNote.classList.toggle("warnnote", city.occlusion);
    };
    markOcclusion();
    // Proximity loading follows the camera. The cap rises from the initial
    // batch to the session ceiling only once the USER moves the camera -- the
    // page's own opening camera move must not count, or the initial cap would
    // be lifted before anyone had looked.
    let cityUserMoved = false;
    const userMoved = () => { cityUserMoved = true; };
    for (const ev of ["pointerdown", "wheel", "touchstart", "keydown"]) {
      viewer.canvas.addEventListener(ev, userMoved, { passive: true });
    }
    for (const id of Object.values(camButtons)) {
      document.getElementById(id).addEventListener("click", userMoved);
    }
    viewer.camera.moveEnd.addEventListener(() => {
      if (cityUserMoved) city.cap = URBAN_LIMITS.maxBuildings;
      refreshCity();
    });
  }
  // Status refresh rides the render loop rather than a timer of its own: one
  // clock on the page, Cesium's. Readiness is checked every frame until the
  // build timings are recorded (a cheap walk over <300 chunks), so a slow
  // frame rate does not inflate them; the HUD text redraws every 10th frame.
  if (URBAN || PROVIDER_PAGE) {
    let cityFrames = 0;
    viewer.scene.postRender.addEventListener(() => {
      cityFrames += 1;
      if (URBAN && city.data && cityTiming.initial_ready_ms === null) cityCounts();
      if (cityFrames % 10 === 0) renderCityStatus();
    });
  }

  // Read by a browser check: what the city layer is actually drawing, from
  // observed renderer state -- never from the config.
  window.NAIGOS_VIEW.provider = () => ({ ...providerStatus(providerProbe),
    tiles_loaded: providerProbe.tilesLoaded, tiles_visible: providerProbe.tilesVisible,
    failures: providerProbe.failures, route: VISUAL.tileset_route || null });
  window.NAIGOS_VIEW.urban = () => {
    const cc = cityCounts();
    const prov = providerStatus(providerProbe);
    return {
      mode: VISUAL.mode,
      requested_geometry: VISUAL.requested_geometry_source || null,
      configured_geometry: VISUAL.geometry_source || null,
      geometry_active: URBAN ? urbanGeometryActive(prov, city.active && cc.shown > 0) : null,
      state: urbanStatusEl.textContent || null,
      buildings_total: cityTotal, buildings_loaded: city.buildingsLoaded,
      buildings_ready: cc.ready, buildings_shown: cc.shown,
      roads_loaded: city.roadsLoaded, roads_shown: cc.roadsShown,
      chunks_loaded: city.loaded.size, chunks_total: city.data ? city.data.chunks.length : 0,
      skipped: city.skipped, occlusion: city.occlusion, overlays_on_top: urbanOverlaysOnTop,
      cache_id: city.data ? city.data.cache_id : null, limits: URBAN_LIMITS,
      timing_ms: cityTiming,
      theme: URBAN ? { key: THEME_KEY, name: THEME.name, roof_shader: !!ROOF_SHADER,
                       applied: urbanThemeApplies(urbanGeometryActive(prov, city.active && cc.shown > 0)) } : null,
    };
  };

  // ------------------------------------------------------- visual modes
  // Two postures, and never both at once.
  //
  //   physics terrain         the globe: the simulation's own heightmap over
  //                           /terrain, skinned with Sentinel-2 or OSM. The
  //                           surface every line-of-sight ray was computed
  //                           against, and the only one that is evidence.
  //   photorealistic context  Google Photorealistic 3D Tiles: the provider's
  //                           own geometry -- ground, buildings, trees -- none
  //                           of which the simulation has ever seen.
  //
  // Entering photorealistic switches the globe OFF. That avoids z-fighting
  // between two surfaces a few metres apart, but the reason is the stronger
  // one: two surfaces on screen is two competing claims about the same ground,
  // and the prettier one is the one that is not evidence. Exactly one surface
  // is drawn at a time, so there is nothing to mistake for the other.
  //
  // Physics is the fallback in every direction. It is what the page boots into
  // unless the server resolved photorealistic; what a provider failure returns
  // to; and what the toggle always leads back to.
  //
  // Nothing in this block touches craft, trails, threatEntities, losLines or
  // the counters. The overlays are entities in world space and are drawn the
  // same way in both modes -- only the surface under them changes.
  // The provider path: photorealistic mode, and urban-presentation when a
  // credential resolved a route (its buildings are Google's, drawn the same way).
  const PHOTO = VISUAL.mode === "photorealistic" || (URBAN && !!VISUAL.tileset);
  const photoBtn = document.getElementById("t-photo");
  const visualNote = document.getElementById("visualnote");
  const banner = document.getElementById("visualonly");
  const terrainNote = document.getElementById("terrainnote");
  // The physics-mode wording, captured before anything can overwrite it: in
  // photorealistic mode it is false, and it has to come back verbatim.
  const PHYSICS_TERRAIN_NOTE = terrainNote.textContent;
  const VISUAL_ONLY_TITLE = "Visual only — photorealistic context";
  const VISUAL_ONLY_BODY = VISUAL.separation_note
    || "PRESENTATION MODE. The surface drawn is the provider's, not the simulation's DEM.";
  document.getElementById("vo-title").textContent = VISUAL_ONLY_TITLE;
  document.getElementById("vo-body").textContent = VISUAL_ONLY_BODY;
  // Google's terms require their attribution and the per-tile data credits to be
  // on screen while the tiles are drawn. Cesium's credit display carries the
  // authoritative per-tile version (showCreditsOnScreen below puts them there
  // rather than behind a popup) and is never suppressed; this is the static
  // restatement, so a screenshot of the banner carries it too.
  document.getElementById("vo-credit").textContent = VISUAL.attribution || "";
  // Buttons that act on the globe, and mean nothing once the globe is off.
  const globeOnlyButtons = [exagBtn, shadeBtn, imgBtn];

  // What the mode costs for the rest of the session. Photorealistic resolves
  // base_imagery to OSM on purpose: Sentinel-2 tiles under an opaque tileset
  // would be metered against the ion quota and never seen. The toggle below
  // brings the SURFACE back, not the skin -- building both layers and switching
  // visibility would spend exactly the ion requests this mode exists to avoid.
  // So the page says so on the control the operator would reach for, and only
  // when a token is present: without one, OSM is what physics mode would have
  // drawn anyway, and there is nothing lost to report.
  if (PHOTO && VISUAL.ion_token_present) {
    imgBtn.title = "OpenStreetMap for this session: photorealistic mode keeps the base layer "
      + "keyless, so Sentinel-2 needs a restart without --visual photorealistic.";
  }

  let tileset = null, tileFailures = 0;
  const DEFAULT_REQUESTS_PER_SERVER = Cesium.RequestScheduler.maximumRequestsPerServer;

  function showPhysicsTerrain(reason) {
    visualMode = "physics";
    if (tileset) tileset.show = false;
    viewer.scene.globe.show = true;
    Cesium.RequestScheduler.maximumRequestsPerServer = DEFAULT_REQUESTS_PER_SERVER;
    applyDepthTest();
    banner.hidden = true;
    terrainNote.textContent = PHYSICS_TERRAIN_NOTE;
    globeOnlyButtons.forEach(b => (b.disabled = false));
    photoBtn.classList.remove("on");
    photoBtn.textContent = "photoreal";
    if (reason) visualNote.textContent = reason;
    providerProbe.shown = false;
    citySurfaceChanged();
  }

  async function showPhotorealisticContext() {
    if (!PHOTO || visualMode === "photorealistic") return;
    photoBtn.disabled = true;
    photoBtn.textContent = "loading…";
    try {
      if (!tileset) {
        // The viewer ships no geocoder at all (geocoder:false above), so the
        // Google-geocoder-only restriction on these tiles is met vacuously;
        // the flag says so and silences the one-time warning.
        const apiOptions = { onlyUsingWithGoogleGeocoder: true };
        // With no key CesiumJS reaches the same tileset through Cesium ion,
        // which the ion token already covers. The key is only for the direct
        // route, and is never set globally.
        if (VISUAL.tileset_route === "google_maps_api" && GOOGLE_API_KEY) {
          apiOptions.key = GOOGLE_API_KEY;
        }
        tileset = await Cesium.createGooglePhotorealistic3DTileset(apiOptions, {
          maximumScreenSpaceError: PHOTO_LIMITS.maximumScreenSpaceError,
          cacheBytes: PHOTO_LIMITS.cacheBytes,
          maximumCacheOverflowBytes: PHOTO_LIMITS.maximumCacheOverflowBytes,
          // Nothing here picks against the mesh or drives on it, and collision
          // geometry is memory spent on a claim this mode refuses to make.
          enableCollision: false,
          showCreditsOnScreen: true,
        });
        providerProbe.created = true;
        // The proof the HUD and NAIGOS_VIEW.provider() rest on: a tile with
        // content loaded, and a tile actually rendered -- not a token, not a
        // route, not a resolved promise.
        tileset.tileLoad.addEventListener(() => { providerProbe.tilesLoaded += 1; });
        tileset.tileVisible.addEventListener(() => { providerProbe.tilesVisible += 1; });
        tileset.tileFailed.addEventListener(() => {
          tileFailures += 1;
          providerProbe.failures = tileFailures;
          if (visualMode !== "photorealistic" || tileFailures < PHOTO_LIMITS.tileFailureBudget) return;
          providerProbe.failed = true;
          providerProbe.reason = `${tileFailures} tile errors`;
          showPhysicsTerrain(
            `Photorealistic context failed after ${tileFailures} tile errors — back on `
            + "physics terrain, which needs no provider.");
        });
        // Protected zones with render_cutout are clipped out of the provider's
        // geometry, not just kept off the camera: nothing of them is drawn.
        if (CUTOUTS.length && Cesium.ClippingPolygonCollection) {
          tileset.clippingPolygons = new Cesium.ClippingPolygonCollection({
            polygons: CUTOUTS.map(z => new Cesium.ClippingPolygon({
              positions: Cesium.Cartesian3.fromDegreesArray([
                z.bbox[0], z.bbox[1], z.bbox[2], z.bbox[1], z.bbox[2], z.bbox[3], z.bbox[0], z.bbox[3]]),
            })),
          });
        }
        viewer.scene.primitives.add(tileset);
      }
      providerProbe.tilesVisible = 0;    // visibility is re-proven every time it is shown
      tileset.show = true;
      providerProbe.shown = true;
    } catch (e) {
      // A rejected key, an offline provider or a quota refusal must land on the
      // mode whose surface is the modelled one, not on a blank globe.
      console.warn("photorealistic context unavailable; staying on physics terrain", e);
      tileset = null;
      providerProbe.failed = true;
      providerProbe.reason = String(e).slice(0, 160);
      showPhysicsTerrain("Photorealistic context unavailable (" + e + ") — physics terrain kept.");
      photoBtn.disabled = true;
      photoBtn.textContent = "photoreal n/a";
      return;
    }
    visualMode = "photorealistic";
    // One surface at a time: the globe goes, and the modelled relief, its
    // imagery and its hillshade go with it.
    viewer.scene.globe.show = false;
    // Entity altitudes go through exagZ(); the tileset is unexaggerated, so a
    // relief multiplier here would float every aircraft above a mesh that never
    // moved. Back to x1 while this mode is on.
    if (EXAG_K !== 1) { exagIdx = 0; applyExag(); }
    globeOnlyButtons.forEach(b => (b.disabled = true));
    Cesium.RequestScheduler.maximumRequestsPerServer = PHOTO_LIMITS.maximumRequestsPerServer;
    applyDepthTest();
    banner.hidden = false;
    terrainNote.textContent = VISUAL_ONLY_BODY;
    photoBtn.disabled = false;
    photoBtn.classList.add("on");
    photoBtn.textContent = "physics terrain";
    citySurfaceChanged();
  }

  photoBtn.onclick = () => {
    if (visualMode === "photorealistic") showPhysicsTerrain(
      "Back on physics terrain: the globe is the simulation's own heightmap again.");
    else showPhotorealisticContext();
  };

  showPhysicsTerrain();
  if (PHOTO) {
    showPhotorealisticContext();
  } else {
    photoBtn.disabled = true;
    photoBtn.title = VISUAL.fallback_reason
      || "start the server with --visual photorealistic for the photorealistic context mode";
    if (VISUAL.fallback_reason) visualNote.textContent = VISUAL.fallback_reason;
  }

  // --------------------------------------------------------------- stream
  const MAX_TRAIL = 900;
  let drawId = 1;

  // ---- visual events: drawn from recorded state, never invented -------------
  // Every event comes from naigos/demo/events.py and names the state transition
  // behind it (ev.cause). Two of them are drawn as effects, and only after the
  // simulation has already resolved the outcome:
  //
  //   launch_visual  a short stylised streak from the threat the kill is
  //                  attributed to, to where the aircraft was when the env
  //                  resolved it -- starting AT that instant, never before, so
  //                  it cannot read as a munition that caused anything;
  //   shot_down      an impact flash at that position once the streak lands.
  //
  // Neither is a simulated round or missile, and nothing here feeds back into
  // the simulation -- this page has no route by which it could. The HUD says so
  // (scene.event_note) under the event log.
  document.getElementById("eventnote").textContent = scene.event_note;
  const EV_TEXT = { detected: "detected", lock_acquired: "LOCK", terrain_masked: "terrain-masked",
                    shot_down: "SHOT DOWN" };
  const EV_CLASS = { lock_acquired: "lock", shot_down: "kill", terrain_masked: "mask" };
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  function renderEventLog(list) {
    document.getElementById("eventlog").innerHTML = list
      .filter(ev => EV_TEXT[ev.type])
      .slice(-7).reverse()
      .map(ev => `<div class="ev ${EV_CLASS[ev.type] || ""}" title="${esc(ev.cause)}">`
        + `<span class="t">t+${Math.round(ev.t_s)}s</span> aircraft ${ev.aircraft} `
        + `${EV_TEXT[ev.type]}${ev.threat !== null && ev.threat !== undefined ? ` · threat ${ev.threat}` : ""}</div>`)
      .join("");
  }

  // Effect entities. `age()` returns seconds since the effect's start: sim
  // seconds on the replay clock (so scrubbing lands on the same picture every
  // time), wall seconds live. Before its start and after its end an effect is
  // not drawn at all.
  const FX_ORANGE = Cesium.Color.fromCssColorString("#ffb648");
  // The time gate lives on each GRAPHIC's show, which is a Property. Entity.show
  // is a plain boolean: a CallbackProperty assigned there is merely truthy, and
  // drew the impact at every instant -- before the kill as well as after it.
  const fxLive = (age, dur) => new Cesium.CallbackProperty(
    () => fxOn && age() >= 0 && age() <= dur, false);
  function tracerFx(from, at, age, dur) {
    const a = c3(...from), b = c3(...at);
    const p = () => Math.min(Math.max(age() / dur, 0), 1);
    return viewer.entities.add({
      polyline: {
        show: fxLive(age, dur),
        positions: new Cesium.CallbackProperty(() => {
          const head = p(), tail = Math.max(0, head - 0.35);
          return [Cesium.Cartesian3.lerp(a, b, tail, new Cesium.Cartesian3()),
                  Cesium.Cartesian3.lerp(a, b, head, new Cesium.Cartesian3())];
        }, false),
        width: 5,
        material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.3, color: FX_ORANGE }),
      },
    });
  }
  function impactFx(at, age, dur) {
    const p = () => Math.min(Math.max(age() / dur, 0), 1);
    return viewer.entities.add({
      position: c3(...at),
      point: {
        show: fxLive(age, dur),
        pixelSize: new Cesium.CallbackProperty(() => 10 + 30 * Math.sqrt(p()), false),
        color: new Cesium.CallbackProperty(
          () => Cesium.Color.fromCssColorString("#ffd27a").withAlpha(1 - p()), false),
        outlineColor: new Cesium.CallbackProperty(
          () => Cesium.Color.fromCssColorString("#ff5a3a").withAlpha(0.9 * (1 - p())), false),
        outlineWidth: 3,
      },
      label: { show: fxLive(age, dur),
               text: "shootdown (simulated outcome)", font: "bold 10px monospace",
               fillColor: Cesium.Color.fromCssColorString("#ffd27a"),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               style: Cesium.LabelStyle.FILL_AND_OUTLINE,
               pixelOffset: new Cesium.Cartesian2(0, -26), scale: 0.85 },
    });
  }

  // ---- one renderer, both modes -------------------------------------------
  // Live frames and recorded frames carry the same aircraft shape, so the draw
  // path is shared. Only the fields a recording cannot have (tracker ray,
  // objective marker, retask flag) are guarded.
  function drawAircraft(aircraft, isReplay) {
    let html = "";
    for (const a of aircraft) {
      const c = craft[a.id], col = AC_COLORS[a.id % AC_COLORS.length];
      const pos = c3(a.lon, a.lat, a.alt);
      // In replay the entity's position and visibility belong to the clock: a
      // SampledPositionProperty and an availability interval that ends where the
      // track ends. Writing them per frame here would overwrite the interpolated
      // position with the nearest logged one and undo the whole point.
      if (!isReplay) {
        c.position = pos;
        // attitude from the airframe state, through the one conversion
        // (modelHpr <-> naigos.demo.attitude.cesium_hpr_deg)
        c.orientation = Cesium.Transforms.headingPitchRollQuaternion(
          pos, modelHpr(a.heading, a.pitch, a.roll, acSpec));
        c.show = a.alive;
        // A re-tasked aircraft teleports to the start line; carrying its old trail
        // across the map would draw a route it never flew.
        if (a.retasked) trailPts[a.id] = [];
        if (a.alive) {
          trailPts[a.id].push(pos);
          if (trailPts[a.id].length > MAX_TRAIL) trailPts[a.id].shift();
        }
      }
      // Track quality shows on the model's outline (and on the marker when the
      // marker is what is drawn): amber once a track is building, red at lock.
      c.point.color = a.lock > 0.6 ? Cesium.Color.fromCssColorString("#ff5a5a")
                    : a.lock > 0.25 ? Cesium.Color.fromCssColorString("#ffb648") : col;
      if (c.model) {
        c.model.silhouetteColor = c.point.color.getValue();
        c.model.silhouetteSize = a.lock > 0.25 ? 2.2 : 1.2;
      }

      if (a.objective) {
        // objective z comes from the frame; at height 0 it sat ~1200 m under
        // the Tehran basin floor once real terrain arrived.
        objMarks[a.id].position = c3(a.objective[0], a.objective[1], a.objective[2] ?? 0);
        objMarks[a.id].show = a.alive;
      }

      // Ray to the strongest tracker, coloured by terrain clearance. Negative
      // clearance means a ridge is cutting it -- the aircraft is masked, and you
      // watch the line vanish into the hillside.
      // Drawn whenever a threat has any look at all -- including a blocked one,
      // which is the whole point: a green ray sinking into a ridge is the
      // mechanic made visible.
      // The ray is drawn as the SAMPLED, REFRACTED curve the model marched --
      // a.los.pts, straight from naigos.demo.los -- and never as a two-point
      // line between the emitter and the aircraft. The model drops every sample
      // for 4/3-earth refraction (~100 m at the midpoint of an 80 km ray), so a
      // straight line clears ridges the model says it does not: the picture
      // would contradict the clearance printed beside it. next-steps E-13.
      const ray = a.los;
      if (!isReplay && a.alive && ray && ray.pts && ray.pts.length > 1) {
        losPts[a.id] = ray.pts.map(p => c3(p[0], p[1], p[2]));
        // Three bands, keyed to los_clearance_scale = 60 m, because visibility()
        // is a sigmoid rather than a step and grazing is where the tactic lives.
        // The band comes from the server so the colour cannot drift from the
        // number: naigos.demo.los.band owns the thresholds.
        losLines[a.id].polyline.material =
          ray.band === "masked"  ? Cesium.Color.fromCssColorString("#45d17a").withAlpha(0.5)
        : ray.band === "grazing" ? Cesium.Color.fromCssColorString("#ffb648").withAlpha(0.6)
                                 : Cesium.Color.fromCssColorString("#ff5a5a").withAlpha(0.6);
        losLines[a.id].show = losOn;
        // The pinch point, marked only while the ray is genuinely cut. A marker
        // on every ray would say nothing; on a blocked one it says exactly where
        // the terrain wins.
        if (ray.blocked && ray.pinch) {
          losBlocks[a.id].position = c3(ray.pinch[0], ray.pinch[1], ray.pinch[2]);
          losBlocks[a.id].label.text = `blocked ${Math.round(-ray.clearance)} m`;
          losBlocks[a.id].show = losOn;
        } else {
          losBlocks[a.id].show = false;
        }
      } else {
        losLines[a.id].show = false;
        losBlocks[a.id].show = false;
      }
      dropPts[a.id] = a.alive
        ? [pos, c3(a.lon, a.lat, a.alt - a.agl)] : [];
      dropLines[a.id].show = xray && a.alive;

      const tag = !a.alive ? '<span class="lost">lost</span>'
                : a.reached ? '<span class="ok">arrived</span>'
                : `${(a.lock * 100).toFixed(0)}%`;
      html += `<div class="ac"><span class="dot" style="background:${col.toCssColorString()}"></span>
        <span class="meter"><i style="width:${(a.alive ? a.lock * 100 : 0).toFixed(0)}%"></i></span>
        <span class="tag">${tag}</span></div>`;
    }
    document.getElementById("aircraft").innerHTML = html;

    // Replay's camera is viewer.trackedEntity, set by the follow button.
    if (isReplay) return;
    if (follow) {
      const alive = aircraft.filter(a => a.alive);
      if (alive.length) {
        const a = alive[0];
        // chase view: looking along the aircraft's own heading, from behind
        viewer.camera.lookAt(
          c3(a.lon, a.lat, a.alt),
          new Cesium.HeadingPitchRange(Cesium.Math.toRadians(chaseHeading(a.lon, a.lat, a.heading ?? 0)),
                                       Cesium.Math.toRadians(FOLLOW.pitch_deg), FOLLOW.range_m));
      }
    }
  }

  function renderCounters(c, isReplay) {
    const rows = isReplay
      ? [["sorties surviving", (c.survival_rate ?? 0).toFixed(3)],
         ["objectives reached", (c.objective_rate ?? 0).toFixed(3)],
         ["shootdowns", c.shootdowns ?? "—"],
         ["terrain losses", c.terrain_losses ?? "—"],
         ["out of bounds", c.bounds_losses ?? "—"],
         ["mean detection prob", (c.mean_detection_prob ?? 0).toFixed(3)]]
      : [["sorties launched", c.sorties_launched],
         ["objectives reached", c.objectives_reached],
         ["shot down", c.shot_down],
         ["terrain losses", c.terrain_losses],
         ["out of bounds", c.bounds_losses],
         ["success rate (per sortie)", c.success_rate ?? "—"],
         ["threat draws", c.threat_draws]];
    // The per-sortie rate above is weighted toward layouts that kill fast (they
    // launch more sorties), so each threat layout's own rate is shown beside it.
    const rate3 = r => (r === null || r === undefined ? "—" : r.toFixed(3));
    const cur = !isReplay && c.current_layout;
    if (cur) {
      rows.push([`this layout`, `${cur.reached}/${cur.finished} (${rate3(cur.success_rate)})`],
                [`layout-mean success (${c.layouts_in_mean ?? c.layouts_completed} layouts)`,
                 rate3(c.layout_mean_success)]);
    }
    document.getElementById("counters").innerHTML =
      rows.map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("");
    const strip = document.getElementById("layoutstrip");
    strip.hidden = !cur || !(c.per_layout || []).length;
    if (strip.hidden) return;
    // One cell per completed layout (the last 20), red at 0 through green at 1;
    // grey for a layout on which no sortie finished.
    strip.innerHTML = c.per_layout.map(t => {
      const r = t.success_rate;
      const bg = r === null ? "#1b2534" : `hsl(${Math.round(r * 130)},65%,52%)`;
      const label = `layout ${t.layout}: ${t.reached}/${t.finished} reached (${rate3(r)}), `
        + `${t.shot_down} shot down, ${t.terrain} terrain, ${t.bounds} bounds, ${t.fuel} fuel, `
        + `${Math.round(t.sim_seconds)} s sim`;
      return `<i role="listitem" style="background:${bg}" title="${label}" aria-label="${label}"></i>`;
    }).join("");
  }

  // ---- fictional ambience: presentation-only VFX ---------------------------
  // naigos.demo.ambience generates the stream on the server from a visual seed
  // -- positions, start times, kinds, sizes, a per-effect seed -- and this
  // section only draws it: ambienceState() (pure, above) turns (event, sim
  // time) into numbers, and nothing here consults a random number or a wall
  // clock for WHAT is drawn. Replay passes the Cesium clock, so a scrub lands
  // on the same picture; live passes the latest frame's sim time.
  //
  // It is not a model. No effect has a cause, an object or an outcome; the
  // layer is labelled fictional wherever it is drawn; and nothing in this
  // section can reach the simulation -- the page has no route that could.
  // Effects are depth-tested (they never draw over an aircraft or a marker),
  // translucent, and generated kilometres from every simulated entity.
  const AMB = scene.ambience || { enabled: false };
  const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const amb = { on: !!AMB.enabled, perf: false, t: 0, recs: new Map(), events: () => [], clock: () => 0 };
  const ambPanel = document.getElementById("ambpanel");
  const ambTag = document.getElementById("ambtag");
  function softDisc(core, edge) {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 64;
    const cx = cv.getContext("2d");
    const g = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, core);
    g.addColorStop(1, edge);
    cx.fillStyle = g;
    cx.fillRect(0, 0, 64, 64);
    return cv.toDataURL();
  }
  const AMB_FLASH_IMG = AMB.enabled ? softDisc("rgba(255,248,222,1)", "rgba(255,140,50,0)") : null;
  const AMB_PUFF_IMG = AMB.enabled ? softDisc("rgba(255,255,255,0.95)", "rgba(255,255,255,0)") : null;
  const SMOKE_COL = Cesium.Color.fromCssColorString("#4f4843");
  const DUST_COL = Cesium.Color.fromCssColorString((ATMOS && ATMOS.haze_color) || "#cdb48e");
  const FLASH_COL = Cesium.Color.fromCssColorString("#fff1c8");
  const SPARK_COL = Cesium.Color.fromCssColorString("#ffb45a");
  const ambCap = () => Math.max(1, Math.floor((AMB.max_concurrent || 8) / (amb.perf ? 2 : 1)));

  function ambBuild(ev) {
    const g = sampleGrid(ev.lon, ev.lat);
    const rec = { ev, g, st: ambienceState(ev, amb.t, REDUCED, amb.perf), ents: [] };
    const at = (dx, dy, h) => Cesium.Cartesian3.fromDegrees(
      ev.lon + dx / mPerDegLon(ev.lat), ev.lat + dy / M_PER_DEG_LAT, exagZ(g + h));
    const on = () => amb.on;
    // one flash, a column of puffs, a dust ring, a few sparks -- each graphic
    // reads rec.st, which the pre-update hook below recomputes once per frame
    rec.ents.push(viewer.entities.add({
      position: at(0, 0, 60),
      billboard: {
        image: AMB_FLASH_IMG, sizeInMeters: true, disableDepthTestDistance: 0,
        width: new Cesium.CallbackProperty(() => ev.scale_m * 9 * (rec.st.flash ? rec.st.flash.scale : 0), false),
        height: new Cesium.CallbackProperty(() => ev.scale_m * 9 * (rec.st.flash ? rec.st.flash.scale : 0), false),
        color: new Cesium.CallbackProperty(() => FLASH_COL.withAlpha(rec.st.flash ? rec.st.flash.alpha : 0), false),
        show: new Cesium.CallbackProperty(() => on() && !!rec.st.flash, false),
      },
    }));
    for (let k = 0; k < AMB_PUFFS; k++) {
      const pk = () => rec.st.puffs[k];
      rec.ents.push(viewer.entities.add({
        position: new Cesium.CallbackProperty(() => {
          const q = pk();
          return q ? at(q.dx, q.dy, q.h) : at(0, 0, 0);
        }, false),
        billboard: {
          image: AMB_PUFF_IMG, sizeInMeters: true, disableDepthTestDistance: 0,
          width: new Cesium.CallbackProperty(() => (pk() ? pk().r * 2 : 0), false),
          height: new Cesium.CallbackProperty(() => (pk() ? pk().r * 2 : 0), false),
          color: new Cesium.CallbackProperty(() => SMOKE_COL.withAlpha(pk() ? pk().alpha : 0), false),
          show: new Cesium.CallbackProperty(() => on() && !!pk(), false),
        },
      }));
    }
    if (ev.kind === "dust_burst") {
      rec.ents.push(viewer.entities.add({
        position: at(0, 0, 0),
        ellipse: {
          semiMajorAxis: new Cesium.CallbackProperty(() => (rec.st.dust ? rec.st.dust.r : 1), false),
          semiMinorAxis: new Cesium.CallbackProperty(() => (rec.st.dust ? rec.st.dust.r : 1), false),
          height: exagZ(g + 3),
          material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(
            () => DUST_COL.withAlpha(rec.st.dust ? rec.st.dust.alpha : 0), false)),
          show: new Cesium.CallbackProperty(() => on() && !!rec.st.dust, false),
        },
      }));
    }
    if (ev.kind === "spark_spray") {
      for (let k = 0; k < AMB_SPARKS; k++) {
        const sk = () => rec.st.sparks[k];
        rec.ents.push(viewer.entities.add({
          position: new Cesium.CallbackProperty(() => (sk() ? at(sk().dx, sk().dy, sk().h + 10) : at(0, 0, 0)), false),
          point: {
            pixelSize: 3, disableDepthTestDistance: 0,
            color: new Cesium.CallbackProperty(() => SPARK_COL.withAlpha(sk() ? sk().alpha : 0), false),
            show: new Cesium.CallbackProperty(() => on() && !!sk(), false),
          },
        }));
      }
    }
    return rec;
  }

  function ambTick() {
    amb.t = amb.clock();
    const active = ambienceActive(amb.events(), amb.t, ambCap());
    const keep = new Set(active.map(ev => ev.id));
    for (const [id, rec] of amb.recs) {
      if (keep.has(id)) continue;
      rec.ents.forEach(e => viewer.entities.remove(e));
      amb.recs.delete(id);
    }
    for (const ev of active) {
      if (!amb.recs.has(ev.id)) amb.recs.set(ev.id, ambBuild(ev));
      amb.recs.get(ev.id).st = ambienceState(ev, amb.t, REDUCED, amb.perf);
    }
  }

  // The haze veil and the heat shimmer: one post-process stage, presentation
  // modes only, both capped by naigos.demo.atmosphere and both off under
  // reduced motion (shimmer) or performance mode (shimmer and veil). Depth-aware:
  // the veil only thickens with distance, so nothing near the camera -- where
  // the aircraft are -- is tinted.
  const VEIL_ON = !!(ATMOS && VISUAL.mode !== "physics" && (ATMOS.dust_alpha > 0 || ATMOS.shimmer > 0));
  if (VEIL_ON) {
    try {
      const hc = Cesium.Color.fromCssColorString(ATMOS.haze_color);
      atmosStage = viewer.scene.postProcessStages.add(new Cesium.PostProcessStage({
        name: "naigos_atmosphere_veil",
        fragmentShader: `
          uniform sampler2D colorTexture;
          uniform sampler2D depthTexture;
          uniform vec3 hazeColor;
          uniform float hazeAlpha;
          uniform float shimmer;
          uniform float phase;
          in vec2 v_textureCoordinates;
          void main() {
            vec2 uv = v_textureCoordinates;
            float band = 1.0 - smoothstep(0.0, 0.45, uv.y);
            uv.x += shimmer * band * sin(uv.y * 240.0 + phase);
            vec4 color = texture(colorTexture, uv);
            float depth = czm_readDepth(depthTexture, v_textureCoordinates);
            float f = 0.0;
            if (depth < 1.0) {
              vec4 eye = czm_windowToEyeCoordinates(gl_FragCoord.xy, depth);
              f = clamp((length(eye.xyz) - 6000.0) / 70000.0, 0.0, 1.0);
            }
            out_FragColor = vec4(mix(color.rgb, hazeColor, f * hazeAlpha), color.a);
          }`,
        uniforms: {
          hazeColor: new Cesium.Cartesian3(hc.red, hc.green, hc.blue),
          hazeAlpha: () => (amb.perf ? 0.0 : ATMOS.dust_alpha),
          shimmer: () => ((REDUCED || amb.perf) ? 0.0 : ATMOS.shimmer),
          // sim time, not wall time: a paused replay holds a still frame
          phase: () => amb.t * 1.7,
        },
      }));
    } catch (e) {
      console.warn("naigos: atmosphere veil unavailable", e);
      atmosStage = null;
    }
  }

  function startAmbience(events, clock) {
    amb.events = events;
    amb.clock = clock;
    if (!AMB.enabled && !VEIL_ON) return;
    viewer.scene.preUpdate.addEventListener(() => {
      if (AMB.enabled) ambTick(); else amb.t = amb.clock();
    });
  }

  if (AMB.enabled) {
    ambPanel.hidden = false;
    const writeAmb = () => {
      ambTag.hidden = !amb.on;
      ambTag.textContent = `FICTIONAL AMBIENCE — presentation VFX, not simulated events · `
        + `${AMB.profile} (${AMB.setting}) · visual seed ${AMB.seed}`;
      document.getElementById("ambnote").textContent = (AMB.note || "")
        + ` Rate ${AMB.rate_per_min}/min, at most ${ambCap()} drawn at once.`
        + (REDUCED ? " Reduced motion: no flashes or sparks; smoke and dust held still." : "")
        + (amb.perf ? " Performance mode: half the effects, no sparks, no veil or shimmer." : "");
    };
    const aBtn = document.getElementById("t-amb");
    const pBtn = document.getElementById("t-perf");
    aBtn.onclick = () => { amb.on = !amb.on; aBtn.classList.toggle("on", amb.on); writeAmb(); };
    pBtn.onclick = () => { amb.perf = !amb.perf; pBtn.classList.toggle("on", amb.perf); writeAmb(); };
    writeAmb();
  }
  // For a browser check: where each drawn effect lands on screen (null when
  // behind the camera), so a screenshot claim can be checked against pixels.
  window.NAIGOS_VIEW.ambienceScreen = () => [...amb.recs.values()].map(rec => {
    const p = Cesium.Cartesian3.fromDegrees(rec.ev.lon, rec.ev.lat, exagZ(rec.g + 200));
    const w = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, p);
    return { id: rec.ev.id, kind: rec.ev.kind, age_s: +(amb.t - rec.ev.t_s).toFixed(1),
             x: w ? Math.round(w.x) : null, y: w ? Math.round(w.y) : null,
             puffs: rec.st.puffs.length, flash: !!rec.st.flash };
  });
  window.NAIGOS_VIEW.ambience = () => ({
    enabled: !!AMB.enabled, on: amb.on, perf: amb.perf, reduced_motion: REDUCED, t: amb.t,
    drawn: amb.recs.size, total: amb.events().length, seed: AMB.seed ?? null,
    setting: AMB.setting ?? null, atmosphere: ATMOS ? ATMOS.key : null, veil: !!atmosStage,
  });

  // ---- replay mode: same renderer, on Cesium's clock ------------------------
  // A recording has every frame already, so time is an axis rather than a
  // stream: the aircraft become SampledPositionProperties on viewer.clock and
  // the animation and timeline widgets play, scrub and rate-change them.
  //
  // Three rules keep that from turning a log into a cartoon.
  //
  //   Sample spacing is the simulation timestep. One sample per logged frame,
  //   at the time that frame happened. Nothing is resampled or smoothed.
  //
  //   Interpolation is LINEAR and degree 1. Cesium's default for three or more
  //   samples is a Lagrange fit, which would invent curvature between logged
  //   states and draw a trajectory the simulation never produced. Straight
  //   segments between logged points are the only claim the data supports.
  //
  //   Availability ends where the track ends. An aircraft that was lost has no
  //   samples after the step it was lost on and no availability past it, so
  //   Cesium stops drawing it there -- rather than holding its last position on
  //   screen for the rest of the timeline as though it were still flying.
  if (REPLAY) {
    const rp = await getRoute("/frames");
    let policy = rp.policies.includes("trained") ? "trained" : rp.policies[0];
    const nFrames = rp.frames[policy].length;
    const dt = rp.dt_s;

    // An arbitrary but FIXED epoch: the recording carries sim seconds, not wall
    // time, and pinning it means two exports of the same rollout produce the
    // same timeline instead of one that moves with the clock on the machine.
    const EPOCH = Cesium.JulianDate.fromIso8601("2000-01-01T00:00:00Z");
    const timeAt = f =>
      Cesium.JulianDate.addSeconds(EPOCH, f * dt, new Cesium.JulianDate());

    viewer.clock.startTime = EPOCH.clone();
    viewer.clock.stopTime = timeAt(nFrames - 1);
    viewer.clock.currentTime = EPOCH.clone();
    viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
    viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK_MULTIPLIER;
    // Sim seconds per wall-clock second. One logged frame per second is too
    // slow to read as flight; the animation widget's rate control moves it.
    viewer.clock.multiplier = dt * 4;
    viewer.timeline.zoomTo(viewer.clock.startTime, viewer.clock.stopTime);

    // Rebuild every track for the current policy. Also the exaggeration hook:
    // samples are absolute Cartesians built through c3(), so a relief change
    // invalidates them exactly the way it invalidates the live trails.
    const buildTracks = () => {
      for (let b = 0; b < scene.n_blue; b++) {
        const sp = new Cesium.SampledPositionProperty();
        sp.setInterpolationOptions({
          interpolationDegree: 1,
          interpolationAlgorithm: Cesium.LinearApproximation,
        });
        let last = -1;
        // Attitude on the same clock, under the same rules: one sample per
        // logged frame, linear, ending where the track ends.
        const so = new Cesium.SampledProperty(Cesium.Quaternion);
        so.setInterpolationOptions({
          interpolationDegree: 1,
          interpolationAlgorithm: Cesium.LinearApproximation,
        });
        for (let f = 0; f < nFrames; f++) {
          const a = rp.frames[policy][f][b];
          if (!a.alive) break;         // a track that stops stops
          sp.addSample(timeAt(f), c3(a.lon, a.lat, a.alt));
          so.addSample(timeAt(f), Cesium.Transforms.headingPitchRollQuaternion(
            c3(a.lon, a.lat, a.alt), modelHpr(a.heading, a.pitch, a.roll, acSpec)));
          last = f;
        }
        craft[b].position = sp;
        craft[b].orientation = so;
        craft[b].availability = last < 0
          ? new Cesium.TimeIntervalCollection()
          : new Cesium.TimeIntervalCollection([
              new Cesium.TimeInterval({ start: EPOCH, stop: timeAt(last) })]);
        craft[b].show = true;          // availability decides, not this flag
        craft[b].path.resolution = dt; // one drawn vertex per logged sample
        craft[b].path.show = trailsOn;
      }
      if (viewer.trackedEntity && !viewer.trackedEntity.isAvailable(viewer.clock.currentTime)) {
        viewer.trackedEntity = undefined;
      }
      buildThreatTracks();
      buildEffects();
    };

    // Threats move on the clock too -- the recording logged their positions at
    // the same frames -- so movers glide between samples exactly as the
    // aircraft do, and a fixed site is placed once.
    const buildThreatTracks = () => {
      const frames = rp.threat_frames[policy];
      const series = new Map();
      frames.forEach((rows, f) => rows.forEach(s => {
        if (!series.has(s[TF.i])) series.set(s[TF.i], []);
        series.get(s[TF.i])[f] = s;
      }));
      for (const [i, rec] of threatRec) {
        const rows = series.get(i);
        if (!rows || !rows[0]) continue;
        const s0 = rows[0];
        const moves = rows.some(s => s && (s[TF.lon] !== s0[TF.lon] || s[TF.lat] !== s0[TF.lat]));
        if (!moves) { placeThreat(i, s0[TF.lon], s0[TF.lat], s0[TF.alt], s0[TF.ground_m], s0[TF.heading]); continue; }
        const mp = new Cesium.SampledPositionProperty();     // the model (DEM-anchored for ground units)
        const dp = new Cesium.SampledPositionProperty();     // the envelope centre
        const op = new Cesium.SampledProperty(Cesium.Quaternion);
        for (const prop of [mp, dp, op]) {
          prop.setInterpolationOptions({ interpolationDegree: 1,
                                         interpolationAlgorithm: Cesium.LinearApproximation });
        }
        rows.forEach((s, f) => {
          if (!s) return;
          const pos = threatModelPos(rec.spec, s[TF.lon], s[TF.lat], s[TF.alt], s[TF.ground_m]);
          mp.addSample(timeAt(f), pos);
          dp.addSample(timeAt(f), c3(s[TF.lon], s[TF.lat], s[TF.alt]));
          op.addSample(timeAt(f), Cesium.Transforms.headingPitchRollQuaternion(
            pos, modelHpr(s[TF.heading], 0, 0, rec.spec)));
        });
        const e = threatEntities.get(i);
        e.position = mp;
        e.orientation = op;
        if (rec.dome) rec.dome.position = dp;
        if (rec.ring) rec.ring.position = dp;
      }
    };

    // Effects keyed to the logged frame the event belongs to, so a replay shows
    // each one at the same instant on every play and every scrub, and never
    // anywhere else. Rebuilt with the tracks (policy switch, relief change).
    let fxEntities = [];
    const TRACER_S = 2 * dt, IMPACT_S = 6 * dt;       // sim seconds on the replay clock
    const buildEffects = () => {
      fxEntities.forEach(e => viewer.entities.remove(e));
      fxEntities = [];
      for (const ev of rp.events[policy] || []) {
        const t0 = timeAt(ev.frame);
        const since = () => Cesium.JulianDate.secondsDifference(viewer.clock.currentTime, t0);
        if (ev.type === "launch_visual" && ev.from && ev.at) {
          fxEntities.push(tracerFx(ev.from, ev.at, since, TRACER_S));
        } else if (ev.type === "shot_down" && ev.at) {
          // the impact follows the streak, if there is one to follow
          const lag = ev.threat !== null ? TRACER_S : 0;
          fxEntities.push(impactFx(ev.at, () => since() - lag, IMPACT_S));
        }
      }
    };
    rebuildTracks = buildTracks;

    const polBox = document.getElementById("rp-policies");
    const LBL = { untrained: "untrained", trained: "TRAINED",
                  direct_route_baseline: "direct route", avoid_nap_baseline: "avoid+nap" };
    rp.policies.forEach(pn => {
      const btn = document.createElement("button");
      btn.textContent = LBL[pn] || pn;
      btn.onclick = () => {
        policy = pn;
        [...polBox.children].forEach(c => c.classList.toggle("on", c === btn));
        buildTracks();
        render(frameAt(viewer.clock.currentTime), true);
      };
      if (pn === policy) btn.classList.add("on");
      polBox.appendChild(btn);
    });
    document.getElementById("replaybar").hidden = false;

    // The HUD reads the nearest LOGGED frame. The positions on screen are
    // interpolated between samples; the numbers beside them are not, because
    // there is no such thing as an interpolated shootdown.
    const frameAt = t => Math.min(nFrames - 1, Math.max(0,
      Math.round(Cesium.JulianDate.secondsDifference(t, EPOCH) / dt)));

    let drawn = -1;
    const render = (f, force) => {
      if (f === drawn && !force) return;
      drawn = f;
      document.getElementById("clock").textContent = (f * dt).toFixed(0);
      drawAircraft(rp.frames[policy][f], /* replay */ true);
      drawThreats(rp.threat_frames[policy][f], /* place */ false);
      // the log shows what had happened by this logged frame -- scrub back and
      // later events leave it again
      renderEventLog((rp.events[policy] || []).filter(ev => ev.frame <= f));
      renderCounters(rp.summaries[policy] || {}, true);
    };

    buildTracks();
    // --camera follow-aircraft on a replay: the tracks exist only now.
    if (cameraMode === "follow_aircraft" && !SAFE_FOLLOW) {
      viewer.trackedEntity = craft.find(c => c.isAvailable(viewer.clock.currentTime));
    }
    // For a browser check: park the clock on a logged frame, and list the
    // recording's events -- the same controls the timeline widget offers.
    window.NAIGOS_VIEW.seekFrame = f => {
      viewer.clock.shouldAnimate = false;
      viewer.clock.currentTime = timeAt(f);
    };
    window.NAIGOS_VIEW.events = () => rp.events[policy] || [];
    viewer.clock.onTick.addEventListener(c => render(frameAt(c.currentTime)));
    // A theatre with camera zones chases by lookAt, like live, so the view can
    // be turned away from a zone; Cesium's entity tracking has no such hook.
    if (SAFE_FOLLOW) {
      viewer.clock.onTick.addEventListener(c => {
        if (!follow) return;
        const b = craft.findIndex(e => e.isAvailable(c.currentTime));
        if (b < 0) return;
        const p = craft[b].position.getValue(c.currentTime);
        if (!p) return;
        const g = Cesium.Cartographic.fromCartesian(p);
        const lon = Cesium.Math.toDegrees(g.longitude), lat = Cesium.Math.toDegrees(g.latitude);
        const a = rp.frames[policy][frameAt(c.currentTime)][b];
        viewer.camera.lookAt(p, new Cesium.HeadingPitchRange(
          Cesium.Math.toRadians(chaseHeading(lon, lat, a.heading ?? 0)),
          Cesium.Math.toRadians(FOLLOW.pitch_deg), FOLLOW.range_m));
      });
    }
    // The fictional ambience runs on the replay clock: scrub anywhere and the
    // same effects are drawn at the same sim seconds.
    const ambEvents = (rp.ambience && rp.ambience.events) || [];
    startAmbience(() => ambEvents,
                  () => Cesium.JulianDate.secondsDifference(viewer.clock.currentTime, EPOCH));
    render(0, true);
    return;
  }

  // Live events arrive in a ring buffer on every frame; each is drawn once, by
  // id. Whatever is already in the buffer when the page connects happened
  // before anyone was watching: it goes in the log, not on the globe.
  const seenEvents = new Set();
  const liveLog = [];
  let primed = false;
  function takeEvents(list) {
    for (const ev of list || []) {
      if (seenEvents.has(ev.id)) continue;
      seenEvents.add(ev.id);
      liveLog.push(ev);
      if (!primed) continue;
      const t0 = performance.now();
      const since = () => (performance.now() - t0) / 1000;
      const TRACER_WALL_S = 0.8, IMPACT_WALL_S = 1.8;
      let fx = null;
      if (ev.type === "launch_visual" && ev.from && ev.at) {
        fx = tracerFx(ev.from, ev.at, since, TRACER_WALL_S);
      } else if (ev.type === "shot_down" && ev.at) {
        const lag = ev.threat !== null ? TRACER_WALL_S : 0;
        fx = impactFx(ev.at, () => since() - lag, IMPACT_WALL_S);
      }
      if (fx) setTimeout(() => viewer.entities.remove(fx), (TRACER_WALL_S + IMPACT_WALL_S + 0.5) * 1000);
    }
    primed = true;
    if (liveLog.length > 64) liveLog.splice(0, liveLog.length - 64);
    renderEventLog(liveLog);
  }

  // The ambience stream arrives with the frames, generated by the server one
  // bucket ahead from the visual seed; the page only draws it, at sim time.
  const ambLive = { t: 0, wall: 0, seen: new Set(), list: [] };
  function liveAmbience(f) {
    ambLive.t = f.t;
    ambLive.wall = performance.now();
    for (const ev of f.ambience || []) {
      if (ambLive.seen.has(ev.id)) continue;
      ambLive.seen.add(ev.id);
      ambLive.list.push(ev);
    }
    const horizon = f.t - 200;
    if (ambLive.list.length > 96) ambLive.list = ambLive.list.filter(ev => ev.t_s + ev.duration_s > horizon);
  }
  startAmbience(() => ambLive.list, () => ambLive.t + Math.min(
    (performance.now() - ambLive.wall) / 1000 * (scene.speed || 1), 2 * (scene.dt_s || 1)));

  const es = new EventSource("/stream");
  es.onmessage = async ev => {
    const f = JSON.parse(ev.data);
    if (f.threat_draw && f.threat_draw !== drawId) {
      drawId = f.threat_draw;
      clearThreats();
      buildThreats(await getRoute("/scene"));
      trailPts.forEach((_, i) => (trailPts[i] = []));
    }
    document.getElementById("clock").textContent = f.t.toFixed(0);
    drawThreats(f.threats, /* place */ true);
    drawAircraft(f.aircraft, false);
    takeEvents(f.events);
    liveAmbience(f);
    renderCounters(f.counters, false);
  };
  es.onerror = () => { document.getElementById("rate").textContent = "stream disconnected"; };
}

boot().catch(e => {
  document.body.insertAdjacentHTML("afterbegin",
    `<pre style="position:absolute;z-index:9;color:#ff8a8a;padding:16px">${e}</pre>`);
  console.error(e);
});
</script>
</body>
</html>
