<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naigos — live</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root { --panel:#0f151dEE; --line:#243347; --fg:#dbe6f3; --dim:#7d92ab;
          --red:#ff5a5a; --amber:#ffb648; --green:#45d17a; }
  html,body,#cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden;
       background:#000; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--fg); }
  #hud { position:absolute; top:12px; left:12px; width:310px; background:var(--panel);
         border:1px solid var(--line); border-radius:8px; padding:13px; backdrop-filter:blur(9px); }
  /* Sits above Cesium's own animation and timeline widgets, which own play,
     scrub and playback rate in replay mode. This bar carries only the thing
     they cannot: which policy's rollout is being drawn. */
  #replaybar { position:absolute; left:190px; bottom:34px; display:flex; gap:10px;
               align-items:center; background:var(--panel); border:1px solid var(--line);
               border-radius:8px; padding:9px 13px; backdrop-filter:blur(9px); }
  #replaybar .rp-label { color:var(--dim); font-size:11px; }
  #status { position:absolute; top:12px; right:12px; background:var(--panel);
            border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  h1 { font-size:13px; margin:0; letter-spacing:.06em; }
  .sub { color:var(--dim); font-size:11px; margin:2px 0 12px; }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim);
       margin:14px 0 6px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:1px 0; } td.k { color:var(--dim); } td.v { text-align:right; font-variant-numeric:tabular-nums; }
  #layoutstrip { display:flex; gap:2px; margin-top:5px; }
  #layoutstrip i { flex:1; max-width:14px; height:9px; border-radius:2px; border:1px solid var(--line); }
  .ac { display:flex; align-items:center; gap:6px; padding:2px 0; font-variant-numeric:tabular-nums; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .meter { flex:1; height:5px; background:#1b2534; border-radius:3px; overflow:hidden; }
  .meter > i { display:block; height:100%; background:var(--amber); transition:width .2s; }
  .tag { min-width:44px; text-align:right; font-size:11px; }
  .lost { color:var(--red); } .ok { color:var(--green); }
  .live { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green);
          margin-right:6px; animation:p 1.6s infinite; }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.25} }
  .note { color:var(--dim); font-size:10px; margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
  button { font:inherit; font-size:11px; background:#1a2432; color:var(--fg); border:1px solid var(--line);
           border-radius:5px; padding:4px 8px; cursor:pointer; }
  button.on { background:#4da3ff; border-color:#4da3ff; color:#04101d; font-weight:600; }
  .row { display:flex; gap:5px; flex-wrap:wrap; }
  button[disabled] { opacity:.45; cursor:not-allowed; }
  /* The visual-only banner. Deliberately not styleable away by a mode switch:
     it is hidden by exactly one thing, leaving photorealistic mode. */
  #visualonly { position:absolute; top:12px; left:342px; right:230px; z-index:5;
                background:#2a1a05EE; border:1px solid var(--amber); border-radius:8px;
                padding:9px 13px; backdrop-filter:blur(9px); pointer-events:none; }
  #visualonly .vo-title { color:var(--amber); font-weight:700; letter-spacing:.08em;
                          font-size:11px; text-transform:uppercase; }
  #visualonly .vo-body { font-size:11px; margin-top:3px; }
  #visualonly .vo-credit { color:var(--dim); font-size:10px; margin-top:4px; }
  #hud { max-height:calc(100% - 110px); overflow-y:auto; }
  /* An element's own display rule must not beat the hidden attribute: the
     replay bar's display:flex used to put an empty "policy" box on live pages. */
  [hidden] { display:none !important; }
  /* A model that failed to load is announced once, in words, where the eye is. */
  #modelwarn { margin-top:10px; padding:7px 9px; border:1px solid var(--amber); border-radius:6px;
               background:#2a1a05; color:var(--amber); font-size:11px; }
  /* Relief multiplier on: said on the globe, not only on the button. */
  #exagbadge { position:absolute; left:50%; transform:translateX(-50%); bottom:70px; z-index:4;
               background:#1d1330EE; border:1px solid #c07fff; color:#e2c9ff; border-radius:6px;
               padding:5px 11px; font-size:11px; pointer-events:none; }
  #filenote { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); z-index:6;
              max-width:560px; background:#2a1a05F2; border:1px solid var(--amber); color:var(--amber);
              border-radius:8px; padding:14px 18px; font-size:12px; }
  #eventlog .ev { font-size:11px; padding:1px 0; font-variant-numeric:tabular-nums; }
  #eventlog .ev .t { color:var(--dim); }
  #eventlog .ev.kill { color:var(--red); }
  #eventlog .ev.lock { color:var(--amber); }
  #eventlog .ev.mask { color:var(--green); }
  /* The city banner: urban-presentation over the simulation DEM. Its own
     element, so the provider banner above keeps exactly one way in and out. */
  #citybanner { position:absolute; top:12px; left:342px; right:230px; z-index:5;
                background:#07232bEE; border:1px solid #5fe3d0; border-radius:8px;
                padding:9px 13px; backdrop-filter:blur(9px); pointer-events:none; }
  #citybanner .vo-title { color:#5fe3d0; font-weight:700; letter-spacing:.08em;
                          font-size:11px; text-transform:uppercase; }
  #citybanner .vo-body { font-size:11px; margin-top:3px; }
  #citybanner .vo-credit { color:var(--dim); font-size:10px; margin-top:4px; }
  /* The scenario line: what the whole scene is, said first, in every mode. */
  #scenario { margin:-6px 0 10px; padding:5px 8px; border:1px solid #6d5a2e; border-radius:6px;
              background:#1d1708; color:#f3d690; font-size:11px; }
  #scenario .ck { display:block; color:var(--dim); margin-top:2px; }
  #scenario .ck.zs { color:var(--amber); }
  /* Fictional ambience: labelled on the globe for as long as it is drawn. */
  #ambtag { position:absolute; left:50%; transform:translateX(-50%); bottom:104px; z-index:4;
            background:#2a0f0aE6; border:1px solid #ff8a5a; color:#ffc7a8; border-radius:6px;
            padding:5px 11px; font-size:11px; pointer-events:none; letter-spacing:.03em; }
  #urbanstatus { font-size:11px; font-variant-numeric:tabular-nums; }
  #urbanstatus .warn { color:var(--amber); }
  #urbanstatus .okc { color:#5fe3d0; }
  #urbannote.warnnote { color:var(--amber); }
  #t-occlusion.on { background:var(--amber); border-color:var(--amber); color:#1d1203; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="hud">
  <h1>NAIGOS <span style="color:var(--dim);font-weight:400" id="theatre"></span></h1>
  <div class="sub"><span class="live"></span><span id="rate"></span></div>
  <div id="scenario"><span id="sc-label"></span><span class="ck" id="sc-ckpt"></span></div>

  <h2>Aircraft — worst track held on it</h2>
  <div id="aircraft"></div>

  <h2>Cumulative</h2>
  <table id="counters"></table>
  <!-- live only: one cell per completed threat layout, coloured by its success rate -->
  <div id="layoutstrip" role="list" aria-label="success rate per completed threat layout" hidden></div>

  <h2>Camera</h2>
  <div class="row">
    <button id="t-overview" class="on">terrain overview</button>
    <button id="t-follow">follow aircraft</button>
    <button id="t-topdown">top-down analysis</button>
    <button id="t-urban">urban overview</button>
    <button id="t-street">street canyon</button>
    <span id="cam-city" class="row"></span>
  </div>

  <h2>Layers</h2>
  <div class="row">
    <button id="t-lethal" class="on">lethal</button>
    <button id="t-detect">detection</button>
    <button id="t-trails" class="on">trails</button>
    <button id="t-los" class="on">LOS rays</button>
    <button id="t-labels" class="on">labels</button>
    <button id="t-fx" class="on">effects</button>
    <button id="t-xray">x-ray</button>
    <button id="t-exag">relief</button>
    <button id="t-shade" class="on">hillshade</button>
    <button id="t-imagery" class="on">imagery</button>
    <button id="t-photo">photoreal</button>
  </div>
  <div id="modelwarn" hidden></div>

  <!-- urban-presentation only. Presentation geometry, stated as such. -->
  <div id="urbanpanel" hidden>
    <h2>City — presentation only</h2>
    <div id="urbanstatus"></div>
    <div class="row" style="margin-top:6px">
      <button id="t-buildings" class="on">buildings</button>
      <button id="t-roads" class="on">roads</button>
      <button id="t-occlusion">building occlusion: off</button>
    </div>
    <div class="note" id="urbannote"></div>
  </div>
  <div class="note" id="providerstatus" hidden></div>

  <!-- conflict_ambience only. Fictional presentation VFX, stated as such. -->
  <div id="ambpanel" hidden>
    <h2>Ambience — fictional, presentation only</h2>
    <div class="row">
      <button id="t-amb" class="on">ambience</button>
      <button id="t-perf">performance mode</button>
    </div>
    <div class="note" id="ambnote"></div>
  </div>
  <div class="note" id="atmosnote"></div>

  <h2>Events — from recorded simulation state</h2>
  <div id="eventlog"></div>
  <div class="note" id="eventnote"></div>

  <div class="note" id="note"></div>
  <div class="note" id="terrainnote"></div>
  <div class="note" id="imagerynote"></div>
  <div class="note" id="visualnote"></div>
</div>

<!-- Shown for as long as, and only as long as, the photorealistic mode is on. -->
<div id="visualonly" hidden>
  <div class="vo-title" id="vo-title"></div>
  <div class="vo-body" id="vo-body"></div>
  <div class="vo-credit" id="vo-credit"></div>
</div>

<div id="status">t+<span id="clock">0</span> s sim · <span id="cammode">terrain overview</span></div>

<!-- Shown while urban-presentation draws on the simulation DEM (local city
     layer, or no layer at all when the urban data is unavailable). -->
<div id="citybanner" hidden>
  <div class="vo-title" id="cb-title"></div>
  <div class="vo-body" id="cb-body"></div>
  <div class="vo-credit" id="cb-credit"></div>
</div>

<div id="exagbadge" hidden></div>
<div id="ambtag" hidden></div>
<div id="filenote" hidden></div>

<div id="replaybar" hidden>
  <span class="rp-label">policy</span>
  <span id="rp-policies" class="row"></span>
</div>

<script>
// Two layers, deliberately separated, and this file never lets them touch.
//   IMAGERY  -- the skin. Sentinel-2 pixels. Cosmetic; the model never sees it.
//   TERRAIN  -- the physics. The simulation's own heightmap, served from
//               /terrain, and the surface every LOS ray was computed against.
// The token is injected by the server from the environment; it is never in this
// file or in the repository. See naigos/demo/imagery.py.
const ION_TOKEN = /*__ION_TOKEN__*/null;
const IMAGERY = /*__IMAGERY__*/{mode: "osm", osm_url: "https://tile.openstreetmap.org/"};
// The whole visual-provider contract (naigos.demo.imagery.VisualConfig.as_dict).
// IMAGERY above is the same contract narrowed to the base layer this file
// draws today; VISUAL additionally carries the mode, the 3D-tileset fields and
// evidence_grade. Credential-free by construction -- the token travels only
// through ION_TOKEN above, and only that one substitution point.
const VISUAL = /*__VISUAL__*/{mode: "physics", evidence_grade: true};
// Needed only on the tileset_route === "google_maps_api" path, where CesiumJS
// talks to Google's endpoint directly rather than through ion. Injected by the
// server from the environment, by its own substitution point, for the same
// reason ION_TOKEN has one: a credential travels by exactly one path, so
// grepping that path is enough to know where it can go.
const GOOGLE_API_KEY = /*__GOOGLE_API_KEY__*/null;

// ---- static export -------------------------------------------------------
// The whole scene, inlined, so this page runs off the filesystem with nothing
// listening on a port: naigos/demo/viewer.py fills EMBED in from a recorded
// demo.json, the live server leaves it null.
//
// It is keyed BY ROUTE -- "/scene", "/frames", "/terrain" -- so a static
// artifact and a served session cannot diverge in what the renderer is handed.
// There is one renderer and one set of shapes; the only difference is where the
// bytes came from. Everything below this point is written against getRoute()
// and getTerrain() and never against fetch(), which is what makes that true.
const EMBED = /*__EMBED__*/null;

const getRoute = async (path) => (EMBED ? EMBED[path] : (await fetch(path)).json());

// int16 metres, base64'd for the static case. Same buffer either way, so the
// bilinear lookup below cannot tell which path it came down.
const getTerrain = async () => {
  if (!EMBED) return (await fetch("/terrain")).arrayBuffer();
  const bin = atob(EMBED["/terrain"]);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
};

// LOD and request budget for the photorealistic tileset. CesiumJS's defaults
// assume the tileset owns the page: a 1.5 GB cache with 1 GB of overflow, and
// collision geometry. Here it is a backdrop on a page that is also holding an
// SSE stream open and stepping a simulation, so it gets a budget instead.
// maximumScreenSpaceError 16 is the library default, restated so it is a
// decision rather than an accident.
const PHOTO_LIMITS = {
  maximumScreenSpaceError: 16,
  cacheBytes: 512 * 1024 * 1024,
  maximumCacheOverflowBytes: 256 * 1024 * 1024,
  maximumRequestsPerServer: 12,
  // Revert to physics after this many tile failures. A provider that starts
  // failing mid-session must not leave a half-drawn backdrop on screen under a
  // banner implying there is something to look at.
  tileFailureBudget: 24,
};
const lethalDomes = [], detectRings = [];
if (ION_TOKEN) Cesium.Ion.defaultAccessToken = ION_TOKEN;

// ---- urban presentation: pure helpers ----------------------------------------
// No Cesium, no DOM, no viewer: tests/test_urban_layer.py runs this span under
// node against mocked state. Everything the city layer DECIDES is in here --
// what to load next, when a provider counts as active -- and the drawing code
// below only carries those decisions out.
/*__URBAN_PURE_BEGIN__*/
const URBAN_SCHEMA = "naigos.urban/1";
// Budget for a normal laptop browser. The Tehran cache is ~37k footprints: the
// page draws the nearest ~14k before the first camera move, adds chunks near
// wherever the camera settles, never holds more than maxBuildings, and hides
// chunks beyond the cull radius. Geometry is built in CesiumJS's web workers
// (asynchronous primitives), and the main thread hands over at most
// sliceBuildings footprints per task, so no single loop blocks the page.
const URBAN_LIMITS = {
  initialBuildings: 14000,
  maxBuildings: 90000,
  sliceBuildings: 1600,
  loadRadiusM: 7000,
  cullRadiusM: 16000,
  // Building occlusion OFF (the default): buildings are drawn see-through, so
  // nothing behind one is hidden, and every simulation marker sits on top.
  // Enough body for the city palette to read as colour, still visibly
  // translucent; the markers-on-top rule does not depend on it.
  seeThroughAlpha: 0.8,
  // Footprints start this far below the lowest DEM point under them, so a
  // building on a slope has no gap under its downhill wall.
  footingM: 1.5,
};

// [x0, y0, dx1, dy1, ...] from index `start` -> flat [lon, lat, lon, lat, ...].
// Mirrors naigos.demo.urban.decode_coords.
function decodeCoords(rec, start, origin, q) {
  const out = [];
  let x = 0, y = 0;
  for (let i = start; i + 1 < rec.length; i += 2) {
    if (i === start) { x = rec[i]; y = rec[i + 1]; } else { x += rec[i]; y += rec[i + 1]; }
    out.push(origin[0] + x * q, origin[1] + y * q);
  }
  return out;
}

function chunkDistanceM(chunk, lon, lat) {
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110574;
  return Math.hypot((chunk.c[0] - lon) * kx, (chunk.c[1] - lat) * ky);
}

// Which chunks to build next: not yet loaded, within radiusM of the focus,
// nearest first, and no further than `cap` buildings in total. The nearest
// chunk is always allowed, so a focus outside every radius still shows the
// city rather than nothing.
function planChunks(chunks, lon, lat, loaded, loadedCount, cap, radiusM) {
  const order = chunks.map((c, i) => [chunkDistanceM(c, lon, lat), i])
    .filter(([, i]) => !loaded.has(i))
    .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const plan = [];
  let n = loadedCount;
  for (const [d, i] of order) {
    const nb = chunks[i].b.length;
    const first = plan.length === 0 && loadedCount === 0;
    if (!first && (d > radiusM || n + nb > cap)) continue;
    plan.push(i);
    n += nb;
  }
  return plan;
}

// Provider readiness from what the renderer has OBSERVED. A credential, a
// resolved route or a created tileset is not "active": only a tileset that is
// shown and has put a tile with content on screen is. `p` is the probe the
// page fills from the tileset's own events.
function providerStatus(p) {
  if (!p || !p.requested) return { state: "not_requested", active: false, label: "provider not requested" };
  if (p.failed) return { state: "failed", active: false, label: "provider failed" + (p.reason ? ` (${p.reason})` : "") };
  if (!p.created) return { state: "loading", active: false, label: "provider loading…" };
  if (!p.shown) return { state: "hidden", active: false, label: "provider tiles hidden (physics terrain on)" };
  if (p.tilesLoaded > 0 && p.tilesVisible > 0) {
    return { state: "active", active: true,
             label: p.urban ? "provider buildings active" : "provider tiles active" };
  }
  return { state: "loading", active: false, label: "provider tileset created — no tile on screen yet" };
}

// Page-relative milliseconds, for the city layer's build-timing DIAGNOSTIC
// only (NAIGOS_VIEW.urban().timing_ms). Nothing is ever drawn or timed by it:
// replay effects run on the replay clock, live effects on their own frames.
const pageClockMs = () => Math.round(performance.now());

// What is actually drawing the city right now, from observed state only.
function urbanGeometryActive(provider, localReady) {
  if (provider && provider.active) return "provider_3d_tiles";
  return localReady ? "local_osm_extrusions" : null;
}
/*__URBAN_PURE_END__*/

/*__URBAN_THEME_BEGIN__*/
// The local city layer's look, and nothing else. Pure like the block above --
// no Cesium, no DOM, no clock, no chance -- so tests/test_urban_theme_page.py
// runs it under node.
//
//   Scope     LOCAL OSM extrusions only. Provider tiles (Google Photorealistic
//             3D Tiles) keep the provider's own materials; nothing here is
//             ever applied to them.
//   Colour    aesthetic only. A building's swatch is a hash of its own
//             footprint record (height and quantised vertices), so one cache
//             and one theatre always paint the same city, whatever order the
//             chunks load in. It encodes no use, owner or category -- the
//             payload carries no such tag -- only the height the extrusion
//             already shows (towers draw from a glassier set).
//   Roads     one width and colour per class the builder emits (0 motorway
//             and trunk, 1 primary and secondary, 2 tertiary, 3 residential),
//             widest and most saturated first. No casing: two draped
//             primitives on one road do not keep a stable draw order in
//             CesiumJS's ground-polyline volumes (the casing strobes through
//             the fill), so contrast comes from colour, width and a darker
//             ground instead.
const URBAN_THEMES = {
  tehran_basin: {
    name: "Tehran: cool stone and terracotta",
    walls: ["#c8714e", "#b85c48", "#dba77a", "#e3cfb1", "#8fa3b8", "#6f969b", "#c99285", "#a7b0bd"],
    towers: ["#8aa7c7", "#6fa8b0", "#d7dde4", "#c8714e"],
    accents: ["#2f9e9a", "#e0a040", "#5f7fb8"],
    roof: "#f3eadb", roofMix: 0.6,
    roads: ["#ff9a3c", "#ffd166", "#fff4df", "#d9d2c6"],
    ground: { saturation: 0.26, brightness: 0.68, contrast: 1.12 },
  },
  dubai_urban: {
    name: "Dubai: teal and gold",
    walls: ["#e6c88e", "#d9a441", "#f2e3c2", "#2e9d96", "#57bdb4", "#efe9dd", "#d69c78", "#c4b49a"],
    towers: ["#3aa7ab", "#7ccfd0", "#d8b25a", "#c7d4d8", "#2b7f86"],
    accents: ["#1f7a78", "#e8b84a", "#e98e62"],
    roof: "#f7f2e8", roofMix: 0.6,
    roads: ["#ff8f4f", "#ffd45e", "#fff6e6", "#dcd5c7"],
    ground: { saturation: 0.3, brightness: 0.7, contrast: 1.1 },
  },
  mecca_urban: {
    name: "Mecca: sandstone and olive",
    walls: ["#d4b184", "#c39556", "#8c9150", "#a8ad7c", "#bb8360", "#eadfc6", "#b9a67c", "#a99c88"],
    towers: ["#e3d0a5", "#9ea57c", "#b48d57", "#d9d2c0"],
    accents: ["#6f7d3c", "#c7a14a"],
    roof: "#f2e9d3", roofMix: 0.6,
    roads: ["#f38b3f", "#f5c95a", "#fbf1dc", "#d8ccb4"],
    ground: { saturation: 0.3, brightness: 0.7, contrast: 1.1 },
  },
  // Any other theatre with a city layer: the same rules, a neutral set.
  default: {
    name: "neutral city",
    walls: ["#c98b62", "#8fa6b8", "#d9c29a", "#7fa38f", "#c9a0a0", "#b8b0a0"],
    towers: ["#9fb4c8", "#d0d6dc", "#7fa9ad"],
    accents: ["#3f9e8f", "#d9a441"],
    roof: "#f2ece2", roofMix: 0.6,
    roads: ["#ff9a3c", "#ffd166", "#fff4df", "#d9d2c6"],
    ground: { saturation: 0.3, brightness: 0.7, contrast: 1.1 },
  },
};
const URBAN_THEME_RULES = {
  towerM: 40,          // at or above this many metres a building draws from `towers`
  accentShare: 0.1,    // share of lower buildings drawn from `accents`
  lightJitter: 0.16,   // total +-lightness spread within one swatch
  wallShade: 0.84,     // walls darkened against roofs, so the two faces separate
};
// Pixel width and opacity per road class. Residential streets are thin and
// quieter: texture, not structure.
const ROAD_WIDTHS_PX = [6.0, 4.4, 3.0, 1.9];
const ROAD_ALPHA = [0.96, 0.93, 0.88, 0.78];

// The payload names its own AOI; the scene's theatre is the fallback.
function urbanThemeKey(payloadAoi, theatre) {
  return payloadAoi || theatre || "default";
}
function urbanTheme(key) {
  return URBAN_THEMES[key] || URBAN_THEMES.default;
}
// Only the local extrusions are themed: provider geometry never is.
function urbanThemeApplies(geometryActive) {
  return geometryActive === "local_osm_extrusions";
}

function hexRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// FNV-1a over the record's integers, then murmur3's finaliser so every input
// bit reaches every output bit. Integer arithmetic only: identical on every
// engine, every run.
function footprintHash(rec) {
  let h = 0x811c9dc5;
  for (let i = 0; i < rec.length; i++) h = Math.imul(h ^ (rec[i] | 0), 0x01000193);
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return h >>> 0;
}

// [r, g, b] 0-255 for one building record ([height_dm, x0, y0, dx1, ...]).
function buildingColor(theme, rec) {
  const h = footprintHash(rec);
  let pool = theme.walls;
  if (rec[0] / 10 >= URBAN_THEME_RULES.towerM) pool = theme.towers;
  else if ((h & 0xff) < URBAN_THEME_RULES.accentShare * 256) pool = theme.accents;
  const base = hexRgb(pool[(h >>> 8) % pool.length]);
  // Lightness from bits the pick barely uses, so neighbours that share a
  // swatch still read as separate masses.
  const k = 1 - URBAN_THEME_RULES.lightJitter / 2 + URBAN_THEME_RULES.lightJitter * ((h >>> 24) / 255);
  return base.map(v => Math.max(0, Math.min(255, Math.round(v * k))));
}

// Road class -> { w, rgba } (rgba 0-1), for one theme.
function roadStyles(theme) {
  return ROAD_WIDTHS_PX.map((w, i) => ({
    w, rgba: [...hexRgb(theme.roads[i]).map(v => v / 255), ROAD_ALPHA[i]],
  }));
}

// Roofs: CesiumJS's own per-instance-colour shaders, patched at two anchors
// each so a face whose normal points up (a roof) is blended toward the
// theme's roof tone, while walls keep the building's swatch, a shade darker. `up` is the
// normal against the geocentric direction -- within 0.2 degrees of the
// ellipsoid normal, far inside the blend band. Returns null when an anchor is
// missing (a different CesiumJS), and the caller then draws the stock shader:
// per-building colour survives, only the roof tint is lost.
const ROOF_ANCHORS = {
  vs: ["void main()", "v_color = color;"],
  fs: ["void main()", "vec4 color = czm_gammaCorrect(v_color);"],
};
function roofShaders(vs, fs, roofRgb, roofMix, wallShade) {
  if (typeof vs !== "string" || typeof fs !== "string") return null;
  if (ROOF_ANCHORS.vs.some(a => vs.indexOf(a) < 0) || ROOF_ANCHORS.fs.some(a => fs.indexOf(a) < 0)) return null;
  const rgb = roofRgb.map(v => (v / 255).toFixed(4)).join(", ");
  return {
    vs: vs.replace("void main()", "out float v_up;\nvoid main()")
      .replace("v_color = color;",
               "v_color = color;\n    v_up = dot(normalize(normal), normalize(position3DHigh + position3DLow));"),
    fs: fs.replace("void main()", "in float v_up;\nvoid main()")
      .replace("vec4 color = czm_gammaCorrect(v_color);",
               "float roof = smoothstep(0.80, 0.95, v_up);\n"
               + `    vec4 roofed = v_color;\n    roofed.rgb = mix(roofed.rgb * mix(${wallShade.toFixed(3)}, 1.0, roof), `
               + `vec3(${rgb}), ${roofMix.toFixed(3)} * roof);\n`
               + "    vec4 color = czm_gammaCorrect(roofed);"),
  };
}
/*__URBAN_THEME_END__*/

/*__CITY_PURE_BEGIN__*/
// The city standard's arithmetic, kept free of Cesium and the DOM so
// tests/test_city_page.py can run it under node and compare it, number for
// number, with naigos/demo/cities.py and naigos/demo/ambience.py.
const M_PER_DEG_LAT = 111132.0;
const mPerDegLon = lat => 111320.0 * Math.cos(lat * Math.PI / 180);

function bearingDeg(lon0, lat0, lon1, lat1) {
  const dx = (lon1 - lon0) * mPerDegLon((lat0 + lat1) / 2);
  const dy = (lat1 - lat0) * M_PER_DEG_LAT;
  return ((Math.atan2(dx, dy) * 180 / Math.PI) % 360 + 360) % 360;
}
function distanceM(lon0, lat0, lon1, lat1) {
  const dx = (lon1 - lon0) * mPerDegLon((lat0 + lat1) / 2);
  const dy = (lat1 - lat0) * M_PER_DEG_LAT;
  return Math.hypot(dx, dy);
}
function angleDiff(a, b) {
  return Math.abs((((a - b + 180) % 360) + 360) % 360 - 180);
}

// naigos.demo.cities.safe_follow_heading, line for line: turn a chase camera
// away from any protected zone whose corners or centre fall in its view cone.
function safeFollowHeading(camLon, camLat, heading, zones, halfAngle, rangeM) {
  let h = ((heading % 360) + 360) % 360;
  for (let it = 0; it < 8; it++) {
    let worst = null;
    for (const z of zones || []) {
      if (!z.policies.includes("camera")) continue;
      const [w, s, e, n] = z.bbox;
      for (const [lon, lat] of [[w, s], [e, s], [e, n], [w, n], [(w + e) / 2, (s + n) / 2]]) {
        if (distanceM(camLon, camLat, lon, lat) > rangeM) continue;
        const b = bearingDeg(camLon, camLat, lon, lat);
        const d = angleDiff(b, h);
        if (d < halfAngle && (worst === null || d < worst[1])) worst = [b, d];
      }
    }
    if (worst === null) return Math.round(h * 1000) / 1000;
    const side = (((h - worst[0]) % 360) + 360) % 360 < 180 ? 1 : -1;
    h = (((worst[0] + side * (halfAngle + 5)) % 360) + 360) % 360;
  }
  return Math.round(h * 1000) / 1000;
}

// The protected zone (camera policy) a point lies in, or null.
function zoneAt(lon, lat, zones, policy) {
  for (const z of zones || []) {
    if (!z.policies.includes(policy)) continue;
    const [w, s, e, n] = z.bbox;
    if (lon >= w && lon <= e && lat >= s && lat <= n) return z.name;
  }
  return null;
}

// A small, seeded PRNG so every effect's sub-variation (puff jitter, spark
// directions) is a pure function of its event seed -- never Math.random.
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Events drawn at sim time t: started, not yet finished, capped at `cap` in
// start order (the stream is already capped server-side; this is the page's
// performance-mode cap on top).
function ambienceActive(events, t, cap) {
  const out = [];
  for (const ev of events) {
    if (t >= ev.t_s && t <= ev.t_s + Math.max(ev.duration_s, ev.flash_s)) out.push(ev);
  }
  out.sort((a, b) => a.t_s - b.t_s || (a.id < b.id ? -1 : 1));
  return out.slice(0, cap);
}

const AMB_PUFFS = 7, AMB_SPARKS = 10, AMB_SMOKE_ALPHA = 0.36, AMB_DUST_ALPHA = 0.3;

// Everything one effect looks like at sim time t, as plain numbers. Pure in
// (ev, t, reduced, perf): the replay clock can be scrubbed anywhere and lands
// on the same picture, and reduced motion freezes the motion rather than the
// information. Offsets are metres east (dx), north (dy) and up (h).
function ambienceState(ev, t, reduced, perf) {
  const age = t - ev.t_s;
  const st = { live: false, flash: null, puffs: [], dust: null, sparks: [] };
  if (age < 0 || age > Math.max(ev.duration_s, ev.flash_s)) return st;
  st.live = true;
  const rnd = mulberry32(ev.seed);
  const dur = Math.max(ev.duration_s, 1);
  const life = a => Math.min(1, a / (0.08 * dur + 0.5)) * Math.max(0, 1 - a / dur);
  if (ev.flash_s > 0 && age <= ev.flash_s && !reduced) {
    const f = age / ev.flash_s;
    st.flash = { scale: 0.4 + 1.6 * Math.sqrt(f), alpha: 1 - f };
  }
  const wind = ev.drift_deg * Math.PI / 180;
  const nPuffs = ev.kind === "spark_spray" ? 0 : (perf ? 3 : AMB_PUFFS);
  const riseS = 0.6 * dur;
  for (let k = 0; k < nPuffs; k++) {
    const born = k * dur * 0.1;
    const jx = (rnd() - 0.5) * ev.scale_m, jy = (rnd() - 0.5) * ev.scale_m;
    let a = age - born;
    if (a < 0) continue;
    if (reduced) a = Math.min(a, 0.35 * dur);
    const h = Math.min(ev.plume_m, ev.plume_m * a / riseS);
    const drift = 0.4 * h;
    st.puffs.push({
      dx: jx + Math.sin(wind) * drift, dy: jy + Math.cos(wind) * drift, h: h + 20,
      r: ev.scale_m * (0.7 + 1.8 * Math.min(1, a / dur)),
      alpha: AMB_SMOKE_ALPHA * life(age - born),
    });
  }
  if (ev.kind === "dust_burst") {
    const dustS = Math.min(dur, 20);
    if (age <= dustS) {
      const f = age / dustS;
      st.dust = { r: ev.scale_m * (1 + 3 * Math.sqrt(reduced ? 0.5 : f)), alpha: AMB_DUST_ALPHA * (1 - f) };
    }
  }
  if (ev.kind === "spark_spray" && !reduced && !perf && age <= 2.5) {
    for (let k = 0; k < AMB_SPARKS; k++) {
      const az = rnd() * 2 * Math.PI, v = 90 + 140 * rnd(), vz = 110 + 160 * rnd();
      st.sparks.push({ dx: Math.sin(az) * v * age, dy: Math.cos(az) * v * age,
                       h: Math.max(0, vz * age - 4.9 * age * age), alpha: Math.max(0, 1 - age / 2.5) });
    }
  }
  return st;
}
/*__CITY_PURE_END__*/

// ---- 3D models --------------------------------------------------------------
// The scene/frame schema this page is written against. naigos/demo/live.py
// SCENE_SCHEMA; a payload from another version is refused, not half-drawn.
const SCENE_SCHEMA = 2;

// Structural check of one GLB before any entity uses it -- the same checks as
// naigos.demo.models.validate_glb. A file that fails here is drawn as a marker
// (announced once, in the HUD); a file that passes is the normal path, and the
// marker is never used for it. A header check is not a render: it is the part
// of "will this load" that can be answered without a GPU.
async function probeModel(spec) {
  if (!spec || !spec.uri) return "no file";
  let buf;
  try {
    buf = await Cesium.Resource.fetchArrayBuffer({ url: spec.uri });
  } catch (e) {
    return "fetch failed";
  }
  if (!buf || buf.byteLength < 20) return "file shorter than a GLB header";
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546C67) return "not a binary glTF";
  if (dv.getUint32(4, true) !== 2) return "not glTF container version 2";
  if (dv.getUint32(8, true) !== buf.byteLength) return "truncated";
  const jlen = dv.getUint32(12, true);
  if (dv.getUint32(16, true) !== 0x4E4F534A) return "first chunk is not JSON";
  let gltf;
  try {
    gltf = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jlen)));
  } catch (e) {
    return "JSON chunk does not parse";
  }
  if (!gltf.asset || gltf.asset.version !== "2.0") return "asset.version is not 2.0";
  const names = new Set((gltf.nodes || []).map(n => n.name));
  for (const n of spec.required_nodes || []) if (!names.has(n)) return `missing node ${n}`;
  return null;
}

// Frame attitude -> Cesium HeadingPitchRoll. Mirrors
// naigos.demo.attitude.cesium_hpr_deg exactly: compass heading -> Cesium's
// east-referenced heading, plus the registry's per-model axis offsets.
const modelHpr = (heading, pitch, roll, spec) => Cesium.HeadingPitchRoll.fromDegrees(
  heading - 90 + spec.heading_offset_deg, pitch + spec.pitch_offset_deg, roll + spec.roll_offset_deg);

const AC_COLORS = [
  Cesium.Color.fromCssColorString("#4da3ff"),
  Cesium.Color.fromCssColorString("#45d17a"),
  Cesium.Color.fromCssColorString("#ffb648"),
  Cesium.Color.fromCssColorString("#c07fff"),
  Cesium.Color.fromCssColorString("#ff7ac0"),
  Cesium.Color.fromCssColorString("#5fe3d0"),
];

async function boot() {
  // Opened straight from the filesystem, the browser will not start CesiumJS's
  // web workers, and those build the terrain mesh: the globe never appears and
  // everything else floats over black space. Say so, rather than let that pass
  // for the picture.
  if (location.protocol === "file:") {
    const n = document.getElementById("filenote");
    n.textContent = "Opened from a file, so the browser blocks the web workers that build the "
      + "terrain -- the globe will not draw. Serve it instead: "
      + "python -m naigos.demo.viewer <recording.json> --open  (or python -m http.server in its folder).";
    n.hidden = false;
  }
  const scene = await getRoute("/scene");
  if (scene.schema_version !== SCENE_SCHEMA) {
    throw new Error(`scene schema ${scene.schema_version} -- this page draws schema ${SCENE_SCHEMA}. `
      + "Regenerate the recording (python -m naigos.demo.replay) or restart the server.");
  }

  // ---- models: probe every file once, before anything is drawn -------------
  // MODELS is the registry from naigos/demo/models.py, handed over in /scene.
  // modelFailed[key] is set only by a failed probe; it is the ONLY thing that
  // can put a marker where a model belongs.
  const MODELS = scene.models.models;
  const modelFailed = {};
  const probes = await Promise.all(Object.keys(MODELS).map(async k => [k, await probeModel(MODELS[k])]));
  for (const [k, why] of probes) if (why) modelFailed[k] = why;
  const failedKeys = Object.keys(modelFailed);
  if (failedKeys.length) {
    // One-time, visible, and non-secret: names the file and the reason only.
    const w = document.getElementById("modelwarn");
    w.textContent = "3D model unavailable -- drawing a marker instead for: "
      + failedKeys.map(k => `${MODELS[k].file} (${modelFailed[k]})`).join(", ")
      + ". Positions and every overlay are unaffected.";
    w.hidden = false;
    console.warn("naigos: model fallback", modelFailed);
  }
  // Read by a browser check (and by nobody else): what this page actually drew.
  window.NAIGOS_VIEW = { schema: scene.schema_version, modelFallbacks: failedKeys.length,
                         failedModels: modelFailed, cameraMode: null };
  // Replay owns the time axis; live cannot, because the next frame has not
  // happened yet. Decided here, before the viewer is built, because the clock
  // widgets are constructor options.
  const REPLAY = scene.mode === "replay";
  document.getElementById("theatre").textContent = "· " + scene.theatre;
  // A recording has no stream rate -- its playback speed is the clock widget's,
  // and changes while you watch. Saying "live · null× real time" over a replay
  // would be two wrong claims in one line.
  document.getElementById("rate").textContent = REPLAY
    ? `replay · ${scene.n_frames} logged frames @ ${scene.dt_s}s · ${scene.n_blue} aircraft`
    : `live · ${scene.speed}× real time · ${scene.n_blue} aircraft · CBF ${scene.cbf ? "on" : "off"}`;
  // The pulsing dot means "this is happening now". It is not, in replay.
  document.querySelector("#hud .live").style.animation = REPLAY ? "none" : "";
  document.getElementById("terrainnote").textContent =
    `Globe surface is the simulation's own heightmap (${scene.terrain.grid} @ `
    + `${scene.terrain.cell_m} m), not a stand-in — so what occludes on screen is what `
    + "occluded in the model. Red LOS ray = threat sees you; green = terrain is cutting it.";
  // ---- what the scene IS, said first -------------------------------------
  // naigos.demo.scenario: a notional simulation, and whether the policy flying
  // it was trained here or is a zero-shot transfer from another theatre.
  const SCENARIO = scene.scenario || { label: "notional contested-airspace simulation",
                                       checkpoint: { text: "checkpoint: not recorded -- treat as zero-shot" } };
  document.getElementById("sc-label").textContent = `scenario: ${SCENARIO.label}`;
  document.getElementById("scenario").title = SCENARIO.note || "";
  {
    const ck = SCENARIO.checkpoint || {};
    const el = document.getElementById("sc-ckpt");
    el.textContent = ck.text || "checkpoint: not recorded -- treat as zero-shot";
    el.classList.toggle("zs", ck.relation !== "trained_on_theatre");
  }
  window.NAIGOS_VIEW.scenario = () => ({ label: SCENARIO.label, notional: SCENARIO.notional !== false,
                                          checkpoint: (SCENARIO.checkpoint || {}).relation || "unknown" });
  document.getElementById("note").textContent =
    "Threat sites are randomly spawned and parameterised — they model no real air-defence "
    + "disposition. Blue is purely evasive and carries no weapon. "
    + "Not measured: " + Object.keys(scene.assumptions).join(", ") + ".";

  // ---- terrain: the surface the SIMULATION used, not a stand-in -------------
  // /terrain serves the env's own heightmap resampled to a lat/lon grid (int16
  // metres). Feeding it through CustomHeightmapTerrainProvider means the globe
  // renders the exact surface every line-of-sight ray was computed against, so
  // the viewer demonstrates terrain masking instead of illustrating it.
  // Measured agreement with the env sampler: mean 1.65 m, max 37.5 m.
  const T = scene.terrain;
  const heights = new Int16Array(await getTerrain());
  const dLon = T.east - T.west, dLat = T.north - T.south;

  function sampleGrid(lonDeg, latDeg) {
    // Outside the modelled box the edge value is held for a short skirt and then
    // feathered to zero, so the AOI does not sit on a cliff. The drawn boundary
    // polyline is what keeps that honest.
    const u = (lonDeg - T.west) / dLon, v = (latDeg - T.south) / dLat;
    const cu = Math.min(Math.max(u, 0), 1), cv = Math.min(Math.max(v, 0), 1);
    const fx = cu * (T.nx - 1), fy = cv * (T.ny - 1);
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const x1 = Math.min(x0 + 1, T.nx - 1), y1 = Math.min(y0 + 1, T.ny - 1);
    const tx = fx - x0, ty = fy - y0;
    const a = heights[y0 * T.nx + x0], b2 = heights[y0 * T.nx + x1];
    const c = heights[y1 * T.nx + x0], d = heights[y1 * T.nx + x1];
    const h = (a * (1 - tx) + b2 * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;

    const over = Math.max(Math.abs(u - cu) * dLon, Math.abs(v - cv) * dLat);
    if (over === 0) return h;
    const SKIRT = 0.05, FEATHER = 0.25;           // degrees
    if (over <= SKIRT) return h;
    if (over >= SKIRT + FEATHER) return 0;
    return h * (1 - (over - SKIRT) / FEATHER);
  }

  // Cesium's verticalExaggeration scales the GLOBE MESH only -- not entity
  // altitudes. Mixing the two puts every aircraft kilometres inside the
  // mountain and makes occlusion unconditionally true, which inverts exactly
  // the claim this viewer exists to demonstrate. So every altitude in this file
  // goes through c3()/exagZ(), and exaggeration defaults to x1.
  let EXAG_K = 1.0;
  let hillshadeLayer = null;
  // Which surface is on screen. Declared here because applyDepthTest() below
  // reads it; "physics" until something deliberately changes it.
  let visualMode = "physics";
  // True while the local city layer is drawn with building occlusion off: every
  // marker is then drawn on top, as in photorealistic mode, so no building can
  // hide one. Declared here because markersForced()/applyDepthTest() read it.
  let urbanOverlaysOnTop = false;
  const exagZ = (alt) => alt * EXAG_K;
  const c3 = (lon, lat, alt) => Cesium.Cartesian3.fromDegrees(lon, lat, exagZ(alt));

  const tilingScheme = new Cesium.GeographicTilingScheme();
  const TILE = 64;
  // Beyond the level where a tile's posts are finer than the served grid,
  // refining is pure interpolation at real cost -- and HeightmapTerrainData
  // claims four children forever, so nothing else stops it.
  //
  // urban-presentation refines further near the camera. Not for the relief --
  // past level 11 it is the same bilinear surface, sampled finer -- but because
  // imagery is draped per terrain tile: a level-11 tile is ~8 km across, which
  // caps the street map under a city at about zoom 12 and leaves the ground
  // under the buildings a blur. Screen-space error keeps the extra levels near
  // the camera only.
  const LMAX = VISUAL.mode === "urban-presentation" ? 15 : 11;
  const terrainProvider = new Cesium.CustomHeightmapTerrainProvider({
    width: TILE, height: TILE, tilingScheme,
    credit: "Naigos simulation heightmap",
    callback: (x, y, level) => {
      const r = tilingScheme.tileXYToRectangle(x, y, level);   // radians
      const w = Cesium.Math.toDegrees(r.west), e = Cesium.Math.toDegrees(r.east);
      const s2 = Cesium.Math.toDegrees(r.south), n = Cesium.Math.toDegrees(r.north);
      const out = new Float32Array(TILE * TILE);
      for (let j = 0; j < TILE; j++) {
        // heightmap rows run north -> south, our grid runs south -> north
        const lat = n - (j / (TILE - 1)) * (n - s2);
        for (let i = 0; i < TILE; i++) {
          out[j * TILE + i] = sampleGrid(w + (i / (TILE - 1)) * (e - w), lat);
        }
      }
      return out;
    },
  });
  const _baseErr = terrainProvider.getLevelMaximumGeometricError.bind(terrainProvider);
  terrainProvider.getLevelMaximumGeometricError = (l) => (l >= LMAX ? 0 : _baseErr(l));

  // ---- imagery: the SKIN, and only the skin --------------------------------
  // Sentinel-2 (Cesium ion asset 3954) draped over the relief above. It is what
  // makes the scene read as real geography, and it is the one layer in this
  // viewer that carries no claim: the model never sees a pixel of it.
  //
  // Not Cesium's default base imagery. That is Bing Aerial -- third-party
  // commercial data, metered by session, under Microsoft's terms rather than
  // Cesium's. Sentinel-2 is ESA/Copernicus open data, so it is free to *use*
  // and not merely free to look at, which is the question a portfolio project
  // should not have to answer.
  const osmLayer = () => new Cesium.ImageryLayer(
    new Cesium.OpenStreetMapImageryProvider({ url: IMAGERY.osm_url }));

  let imageryCredit = IMAGERY.attribution;
  let baseLayer;
  if (IMAGERY.mode === "sentinel2") {
    try {
      // fromAssetId, not the constructor: the constructor form was removed in
      // CesiumJS 1.107 and silently yields a provider that never resolves.
      baseLayer = new Cesium.ImageryLayer(
        await Cesium.IonImageryProvider.fromAssetId(IMAGERY.ion_asset));
    } catch (e) {
      // A rejected token or an offline ion should degrade to a working globe,
      // not a black one -- the terrain, and every claim resting on it, is
      // unaffected by which imagery is draped over it.
      console.warn("Cesium ion Sentinel-2 unavailable; falling back to OSM", e);
      baseLayer = osmLayer();
      imageryCredit = IMAGERY.osm_attribution + " (Sentinel-2 unavailable)";
    }
  } else {
    baseLayer = osmLayer();
  }

  const opts = {
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, infoBox: false,
    // The clock widgets exist exactly when there is a fixed time axis to drive:
    // a recording has every frame already, a live stream does not have the next
    // one yet. Scrubbing a stream would mean inventing it.
    animation: REPLAY, timeline: REPLAY, shouldAnimate: REPLAY,
    selectionIndicator: false, fullscreenButton: false,
    // The two layers enter the viewer through two different options, from two
    // different sources, and nothing downstream merges them.
    terrainProvider,   // physics: the simulation's DEM
    baseLayer,         // skin: Sentinel-2 (or OSM)
  };
  const viewer = new Cesium.Viewer("cesiumContainer", opts);
  // Cesium ion's Content Usage guide requires the provider attribution to be on
  // screen. CesiumJS emits it from the asset's own credit into the credit
  // display bottom-right, so that display stays visible on purpose; the HUD line
  // below restates it so a screenshot carries it too.
  // IMAGERY describes the base layer only, so this line always credits the
  // pixels actually under the cursor: OSM in photorealistic mode, where the
  // keyless layer is what shows through the tileset's edges. The tileset's own
  // credit belongs to the banner and to Cesium's credit display.
  document.getElementById("imagerynote").textContent =
    imageryCredit + " " + IMAGERY.separation_note;
  // CustomHeightmapTerrainProvider supplies no vertex normals, so Cesium cannot
  // light the surface at all -- the Alborz would render as a flat map under any
  // imagery. Derive a hillshade from the SAME height array (Horn gradient, lit
  // by scene.lighting -- the one sun the models are lit by too) and drape it
  // over the imagery. Same source as the mesh, so the shading cannot disagree
  // with the geometry. naigos.demo.camera.hillshade is the reference.
  //
  // Lit as max(0, n . sun) with n the surface normal: the earlier form fed a
  // compass azimuth into a math-azimuth formula, which lit every slope from the
  // mirror-image direction -- west faces went dark under a north-west sun.
  //
  // Draped over hillshade_rectangle, not the grid box: one pixel per terrain
  // post, with half a post of margin, so each pixel centre sits ON its post and
  // the shading lines up with the mesh instead of half a cell beside it.
  const LIGHT = scene.lighting;
  const SUN_AZ = Cesium.Math.toRadians(LIGHT.sun_azimuth_deg);
  const SUN_EL = Cesium.Math.toRadians(LIGHT.sun_altitude_deg);
  const SUN = [Math.sin(SUN_AZ) * Math.cos(SUN_EL), Math.cos(SUN_AZ) * Math.cos(SUN_EL), Math.sin(SUN_EL)];
  const shadeValue = (dzdx, dzdy) =>
    Math.min(Math.max((-dzdx * SUN[0] - dzdy * SUN[1] + SUN[2]) / Math.sqrt(dzdx * dzdx + dzdy * dzdy + 1), 0), 1);
  const postX = dLon / (T.nx - 1), postY = dLat / (T.ny - 1);
  const HILLSHADE_RECT = Cesium.Rectangle.fromDegrees(
    T.west - postX / 2, T.south - postY / 2, T.east + postX / 2, T.north + postY / 2);
  function hillshadeImage(zf) {
    const cv = document.createElement("canvas");
    cv.width = T.nx; cv.height = T.ny;
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(T.nx, T.ny);
    const mPerDegLat = 111132.0;
    const mPerDegLon = 111320.0 * Math.cos(((T.south + T.north) / 2) * Math.PI / 180);
    const ex = postX * mPerDegLon, ey = postY * mPerDegLat;
    // zf: the relief multiplier, so an exaggerated mesh is shaded as drawn
    const at = (r, c) => zf * heights[Math.min(Math.max(r, 0), T.ny - 1) * T.nx
                                     + Math.min(Math.max(c, 0), T.nx - 1)];
    for (let r = 0; r < T.ny; r++) {
      for (let c = 0; c < T.nx; c++) {
        const dzdx = ((at(r - 1, c + 1) + 2 * at(r, c + 1) + at(r + 1, c + 1))
                    - (at(r - 1, c - 1) + 2 * at(r, c - 1) + at(r + 1, c - 1))) / (8 * ex);
        // grid row r+1 is NORTH of row r
        const dzdy = ((at(r + 1, c - 1) + 2 * at(r + 1, c) + at(r + 1, c + 1))
                    - (at(r - 1, c - 1) + 2 * at(r - 1, c) + at(r - 1, c + 1))) / (8 * ey);
        const v = shadeValue(dzdx, dzdy);
        // canvas row 0 is the image top = north; the grid's row 0 is south
        const o = ((T.ny - 1 - r) * T.nx + c) * 4;
        // floor of 0.18 so shadowed faces keep their imagery legible
        const g = Math.round(255 * (0.18 + 0.82 * v));
        img.data[o] = img.data[o + 1] = img.data[o + 2] = g;
        img.data[o + 3] = 160;
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv.toDataURL();
  }
  function applyHillshade(zf) {
    const show = hillshadeLayer ? hillshadeLayer.show : true;
    if (hillshadeLayer) viewer.imageryLayers.remove(hillshadeLayer, true);
    const layer = viewer.imageryLayers.addImageryProvider(
      new Cesium.SingleTileImageryProvider({
        url: hillshadeImage(zf), tileWidth: T.nx, tileHeight: T.ny,
        rectangle: HILLSHADE_RECT,
      }));
    // Sentinel-2 already carries its own sun shading, so a heavy grey wash over
    // it destroys the imagery for no gain; OSM is flat line-work and needs the
    // relief cue much more.
    // Under the city the OSM base is toned down (see the urban block), and the
    // relief then carries the landscape: shade it harder there.
    layer.alpha = IMAGERY.mode === "sentinel2" ? 0.34
      : (VISUAL.mode === "urban-presentation" ? 0.74 : 0.58);
    layer.show = show;
    hillshadeLayer = layer;
  }
  applyHillshade(1.0);

  // The models' light is the hillshade's sun, fixed in the AOI's local frame.
  // Cesium's default follows the clock's real sun, which for a replay epoch of
  // 2000-01-01T00:00Z is below the horizon over both AOIs -- every model would
  // be lit from underneath, against a terrain shaded from the north-west.
  {
    const enu = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(
      (T.west + T.east) / 2, (T.south + T.north) / 2, 0));
    const toward = new Cesium.Cartesian3(-SUN[0], -SUN[1], -SUN[2]);   // light travels away from the sun
    viewer.scene.light = new Cesium.DirectionalLight({
      direction: Cesium.Cartesian3.normalize(
        Cesium.Matrix4.multiplyByPointAsVector(enu, toward, new Cesium.Cartesian3()),
        new Cesium.Cartesian3()),
      intensity: 2.2,
    });
  }

  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.scene.globe.showSkirts = true;
  viewer.scene.globe.maximumScreenSpaceError = 3;
  viewer.scene.skyAtmosphere.show = true;

  // ---- atmosphere: a presentation-only profile from the allowlist ----------
  // naigos.demo.atmosphere. The sun direction already came in scene.lighting
  // (the hillshade and the model light above use it); this adds the light's
  // colour, the sky tint and the distance haze. Renderer constants only: no
  // profile reaches the simulation, and the haze is capped so it can never
  // hide an aircraft, a threat, a marker or a label.
  const ATMOS = scene.atmosphere || null;
  let atmosStage = null;
  if (ATMOS) {
    viewer.scene.light.color = Cesium.Color.fromCssColorString(ATMOS.light_color);
    viewer.scene.light.intensity = ATMOS.light_intensity;
    const sky = viewer.scene.skyAtmosphere;
    sky.hueShift = ATMOS.sky_hue_shift;
    sky.saturationShift = ATMOS.sky_saturation_shift;
    sky.brightnessShift = ATMOS.sky_brightness_shift;
    if (viewer.scene.atmosphere) {
      viewer.scene.atmosphere.hueShift = ATMOS.sky_hue_shift;
      viewer.scene.atmosphere.saturationShift = ATMOS.sky_saturation_shift;
      viewer.scene.atmosphere.brightnessShift = ATMOS.sky_brightness_shift;
    }
    viewer.scene.fog.enabled = true;
    viewer.scene.fog.density = ATMOS.fog_density;
    viewer.scene.fog.minimumBrightness = ATMOS.fog_min_brightness;
    document.getElementById("atmosnote").textContent =
      `Atmosphere: ${ATMOS.key} — ${ATMOS.description} Presentation only; sun, sky and haze `
      + "are renderer constants and never reach detection, LOS or any simulation result.";
  }
  // Depth test ON by default so aircraft genuinely vanish behind ridges -- that
  // occlusion is the visual proof of the mechanic. The x-ray toggle lifts it.
  viewer.scene.minimumDisableDepthTestDistance = 0.0;

  // The edge of the modelled world, drawn rather than left as a mystery.
  viewer.entities.add({
    polyline: {
      positions: Cesium.Cartesian3.fromDegreesArray([
        T.west, T.south, T.east, T.south, T.east, T.north, T.west, T.north, T.west, T.south]),
      width: 1.5, clampToGround: true,
      material: new Cesium.PolylineDashMaterialProperty({
        color: Cesium.Color.fromCssColorString("#7d92ab").withAlpha(0.8) }),
    },
  });

  // ------------------------------------------------------------- camera
  // Three presets from naigos/demo/camera.py, computed server-side from this
  // AOI's bounds and relief. The page opens on terrain_overview -- oblique, so
  // the relief reads as relief -- and top-down is a choice, never the first
  // impression. follow_aircraft is applied per frame (live) or by entity
  // tracking (replay) further down, where the aircraft exist.
  const CAM = scene.camera;
  let cameraMode = CAM.default;
  const camButtons = { terrain_overview: "t-overview", follow_aircraft: "t-follow",
                       top_down_analysis: "t-topdown", urban_overview: "t-urban",
                       street_canyon: "t-street" };
  const CAM_LABEL = { terrain_overview: "terrain overview", follow_aircraft: "follow aircraft",
                      top_down_analysis: "top-down analysis", urban_overview: "urban overview",
                      street_canyon: "street canyon" };
  // Oblique orbit presets: a target, a heading, a pitch and a range. The city
  // views are these too -- never a rectangle fly-to.
  const ORBITS = ["terrain_overview", "urban_overview", "street_canyon",
                  "coastal_corridor", "valley_overview"];
  // A theatre's city config may declare views only it can frame (its coast,
  // its valley). naigos.demo.cities checked each against the drawn DEM, its
  // safe region and its protected zones before this page was served.
  for (const key of ["coastal_corridor", "valley_overview"]) {
    if (!CAM[key]) continue;
    const b = document.createElement("button");
    b.id = "t-" + key.replace("_", "-");
    b.textContent = CAM[key].label || key.replace("_", " ");
    document.getElementById("cam-city").appendChild(b);
    camButtons[key] = b.id;
    CAM_LABEL[key] = CAM[key].label || key.replace("_", " ");
  }
  function frameCamera(mode) {
    if (ORBITS.includes(mode) && CAM[mode]) {
      const o = CAM[mode];
      viewer.camera.lookAt(
        Cesium.Cartesian3.fromDegrees(o.lon, o.lat, exagZ(o.height_m)),
        new Cesium.HeadingPitchRange(Cesium.Math.toRadians(o.heading_deg),
                                     Cesium.Math.toRadians(o.pitch_deg), o.range_m));
      // lookAt pins the camera to the target; release it so the mouse orbits freely
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    } else if (mode === "top_down_analysis") {
      const r = CAM.top_down_analysis;
      viewer.camera.setView({ destination: Cesium.Rectangle.fromDegrees(r.west, r.south, r.east, r.north) });
    }
  }
  function markCamera() {
    for (const [m, id] of Object.entries(camButtons)) {
      document.getElementById(id).classList.toggle("on", m === cameraMode);
    }
    document.getElementById("cammode").textContent = CAM_LABEL[cameraMode];
    window.NAIGOS_VIEW.cameraMode = cameraMode;
  }
  // ---- protected zones: kept out of the camera and off the screen ---------
  // CAM.protected is the theatre's zones (name and buffered box only). A zone
  // with render_cutout is covered by a plain neutral patch over the imagery
  // and clipped out of any provider tileset; a zone with camera policy is a
  // place the free camera may not enter and the chase camera may not face.
  const ZONES = CAM.protected || [];
  const CUTOUTS = ZONES.filter(z => z.policies.includes("render_cutout"));
  const SAFE_FOLLOW = ZONES.some(z => z.policies.includes("camera"));
  const FOLLOW_HALF = (CAM.follow_aircraft || {}).view_half_angle_deg || 55;
  const FOLLOW_RANGE = (CAM.follow_aircraft || {}).framing_range_m || 30000;
  if (CUTOUTS.length) {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 4;
    const cx = cv.getContext("2d");
    cx.fillStyle = "#b8ad98";
    cx.fillRect(0, 0, 4, 4);
    const fill = cv.toDataURL();
    for (const z of CUTOUTS) {
      const [w, s, e, n] = z.bbox;
      const layer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
        url: fill, tileWidth: 4, tileHeight: 4, rectangle: Cesium.Rectangle.fromDegrees(w, s, e, n) }));
      layer.alpha = 1.0;
    }
  }
  // The free camera: if a drag or a zoom puts it inside a camera zone, it is
  // put back where it last stood outside one.
  let lastSafeView = null;
  if (SAFE_FOLLOW) {
    viewer.camera.percentageChanged = 0.02;
    viewer.camera.changed.addEventListener(() => {
      const c = viewer.camera.positionCartographic;
      const lon = Cesium.Math.toDegrees(c.longitude), lat = Cesium.Math.toDegrees(c.latitude);
      if (zoneAt(lon, lat, ZONES, "camera") === null) {
        lastSafeView = { destination: viewer.camera.positionWC.clone(),
                         orientation: { heading: viewer.camera.heading, pitch: viewer.camera.pitch,
                                        roll: viewer.camera.roll } };
      } else if (lastSafeView) {
        viewer.camera.setView(lastSafeView);
      }
    });
  }
  // The chase view, turned away from any camera zone it would frame.
  function chaseHeading(lon, lat, heading) {
    if (!SAFE_FOLLOW) return heading;
    const back = FOLLOW.range_m * Math.cos(Cesium.Math.toRadians(-FOLLOW.pitch_deg));
    const b = Cesium.Math.toRadians(heading + 180);
    const clon = lon + back * Math.sin(b) / mPerDegLon(lat), clat = lat + back * Math.cos(b) / M_PER_DEG_LAT;
    return safeFollowHeading(clon, clat, heading, ZONES, FOLLOW_HALF, FOLLOW_RANGE);
  }
  window.NAIGOS_VIEW.zones = () => ({ protected: ZONES.map(z => z.name), cutouts: CUTOUTS.length,
                                      camera_clamp: SAFE_FOLLOW });

  frameCamera(cameraMode);
  markCamera();
  // What is actually on the globe, by kind -- for a browser check to read.
  window.NAIGOS_VIEW.counts = () => {
    const all = viewer.entities.values;
    const shown = e => e.isShowing;
    return {
      models: all.filter(e => e.model && shown(e)).length,
      markers_forced: markersForced(),
      lethal_domes: lethalDomes.filter(shown).length,
      threats: threatEntities.size,
      aircraft: craft.filter(shown).length,
    };
  };

  // ------------------------------------------------------------- threats
  // Rebuilt whenever the server re-draws the threat field, otherwise stale
  // envelopes stay painted over a map that no longer has those sites.
  //
  // Each threat is a glTF model chosen by naigos.demo.models from the kind's
  // own fields (airborne -> interceptor_drone; ground and mobile ->
  // ground_vehicle; ground and fixed -> sensor_site). Ground classes stand on
  // the SIMULATION's DEM height under them (t.ground_m, sampled server-side
  // with the env's own sample_height), never on the ellipsoid or sea level.
  const threatEntities = new Map();
  const threatRec = new Map();   // i -> { spec, key, turret, dome, ring, last }
  // Lethal envelopes are on in the evidence modes. In urban-presentation they
  // start off: an AOI a few tens of km across sits inside several of them, and
  // their translucent red would wash over the whole city. One click away.
  let lethalOn = VISUAL.mode !== "urban-presentation", detectOn = false, labelsOn = true;
  // Markers are the fallback for a failed model and nothing else -- except
  // that x-ray and photorealistic mode, which already lift depth testing for
  // every overlay, show them too, so a model hidden by a ridge (x-ray) or by a
  // provider building the simulation never saw (photorealistic) stays findable.
  const markersForced = () => xray || visualMode === "photorealistic" || urbanOverlaysOnTop;
  const THREAT_TINT = Cesium.Color.fromCssColorString("#ff5040");
  const TRACK_GLOW = Cesium.Color.fromCssColorString("#ffb648");
  const anchorZ = (groundM, spec) => exagZ(groundM) + spec.altitude_offset_m;
  const threatModelPos = (spec, lon, lat, alt, groundM) => (spec.anchor === "ground"
    ? Cesium.Cartesian3.fromDegrees(lon, lat, anchorZ(groundM, spec))
    : c3(lon, lat, alt));
  const yawQuat = deg => Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y,
                                                         Cesium.Math.toRadians(deg));
  // Packed per-frame threat state -> named fields (naigos.demo.live.THREAT_STATE_FIELDS).
  const TF = Object.fromEntries(scene.threat_state_fields.map((k, j) => [k, j]));

  function clearThreats() {
    for (const e of threatEntities.values()) viewer.entities.remove(e);
    for (const e of lethalDomes) viewer.entities.remove(e);
    for (const e of detectRings) viewer.entities.remove(e);
    threatEntities.clear();
    threatRec.clear();
    lethalDomes.length = 0;
    detectRings.length = 0;
  }

  function placeThreat(i, lon, lat, alt, groundM, heading) {
    const rec = threatRec.get(i);
    if (!rec) return;
    rec.last = [lon, lat, alt, groundM, heading];
    const e = threatEntities.get(i);
    const pos = threatModelPos(rec.spec, lon, lat, alt, groundM);
    e.position = pos;
    // The simulation holds interceptors level (a 2.5D pursuer) and ground
    // units on the surface, so heading is the only attitude it has to give.
    e.orientation = Cesium.Transforms.headingPitchRollQuaternion(pos, modelHpr(heading, 0, 0, rec.spec));
    // Envelopes: a mover's reads rec.domePos through a CallbackProperty (the
    // dynamic-geometry path, updated in place); a fixed site's is re-assigned
    // only if it actually changed (a relief change). Assigning a new constant
    // every frame would make Cesium rebuild the ellipsoid asynchronously five
    // times a second, and it would never finish drawing.
    const dp = c3(lon, lat, alt);
    const changed = !rec.domePos || !Cesium.Cartesian3.equalsEpsilon(dp, rec.domePos, 0, 0.5);
    rec.domePos = dp;
    if (changed && !rec.moving) {
      if (rec.dome) rec.dome.position = dp;
      if (rec.ring) rec.ring.position = dp;
    }
  }

  function buildThreats(scene) {
  for (const t of scene.threats) {
    if (!t.active) continue;
    const spec = MODELS[t.model];
    const failed = !!modelFailed[t.model];
    const turret = spec.turret_node
      ? new Cesium.NodeTransformationProperty({ rotation: yawQuat(0) }) : null;
    const e = viewer.entities.add({
      model: failed ? undefined : {
        uri: spec.uri, scale: spec.scale,
        minimumPixelSize: spec.minimum_pixel_size, maximumScale: spec.maximum_scale,
        enableVerticalExaggeration: false,   // anchorZ()/c3() already exaggerated it
        color: THREAT_TINT, colorBlendMode: Cesium.ColorBlendMode.MIX, colorBlendAmount: 0.55,
        silhouetteColor: TRACK_GLOW, silhouetteSize: 0.0,
        nodeTransformations: turret ? { [spec.turret_node]: turret } : undefined,
      },
      point: { pixelSize: failed ? spec.fallback_pixel_size : 6,
               color: Cesium.Color.fromCssColorString(spec.fallback_color),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 1,
               show: new Cesium.CallbackProperty(() => failed || markersForced(), false) },
      // Secondary to the model: small, dim, fading with distance, toggleable.
      label: { text: t.label.replace(/_/g, " "), font: "10px monospace",
               fillColor: Cesium.Color.fromCssColorString("#ff9d9d").withAlpha(0.85),
               pixelOffset: new Cesium.Cartesian2(0, -22), scale: 0.8,
               disableDepthTestDistance: Number.POSITIVE_INFINITY,
               translucencyByDistance: new Cesium.NearFarScalar(3e4, 1.0, 2.0e5, 0.0),
               show: new Cesium.CallbackProperty(() => labelsOn, false) },
    });
    threatEntities.set(t.i, e);
    const rec = { spec, key: t.model, turret, dome: null, ring: null, last: null,
                  moving: t.mobile || t.airborne, domePos: c3(t.lon, t.lat, t.alt) };
    threatRec.set(t.i, rec);
    const envelopeAt = rec.moving ? new Cesium.CallbackProperty(() => rec.domePos, false) : rec.domePos;

    // Envelopes are altitude BANDS, not hemispheres: a half-height ellipsoid
    // squashed to the class's engagement ceiling is the honest shape.
    if (t.lethal_m > 0) {
      const h = Math.min(t.lethal_m, t.alt_max_m);
      lethalDomes.push(viewer.entities.add({
        position: envelopeAt,
        ellipsoid: {
          radii: new Cesium.Cartesian3(t.lethal_m, t.lethal_m, h * EXAG_K),
          material: Cesium.Color.fromCssColorString("#ff3b3b").withAlpha(0.10),
          outline: true, outlineColor: Cesium.Color.fromCssColorString("#ff3b3b").withAlpha(0.35),
          outlineWidth: 1,
        },
      }));
      lethalDomes[lethalDomes.length - 1]._naigosH = h;   // unexaggerated, for rescaling
      rec.dome = lethalDomes[lethalDomes.length - 1];
    }
    if (t.detect_m > 0) {
      const d = viewer.entities.add({
        position: envelopeAt,
        ellipse: {
          semiMajorAxis: t.detect_m, semiMinorAxis: t.detect_m,
          material: Cesium.Color.fromCssColorString("#ffb648").withAlpha(0.05),
          outline: true, outlineColor: Cesium.Color.fromCssColorString("#ffb648").withAlpha(0.30),
          height: 0,
        },
        show: false,
      });
      detectRings.push(d);
      rec.ring = d;
    }
    placeThreat(t.i, t.lon, t.lat, t.alt, t.ground_m, t.heading);
  }
  lethalDomes.forEach(e => (e.show = lethalOn));
  detectRings.forEach(e => (e.show = detectOn));
  }

  // One frame of packed threat state. Live writes positions here; replay's
  // positions and orientations are sampled on the clock (see the replay block),
  // so it passes placeIt=false and only the sensor slew and the track glow --
  // read off the nearest LOGGED frame, like every HUD number -- are written.
  function drawThreats(states, placeIt) {
    for (const s of states || []) {
      const i = s[TF.i];
      const rec = threatRec.get(i);
      if (!rec) continue;
      if (placeIt) placeThreat(i, s[TF.lon], s[TF.lat], s[TF.alt], s[TF.ground_m], s[TF.heading]);
      const tracking = s[TF.track] >= 0;
      // The sensor/turret faces the platform's heading unless the simulation's
      // track matrix says this threat is tracking an aircraft; then it slews to
      // that aircraft (sensor_yaw, from naigos.demo.attitude.sensor_yaw_deg).
      if (rec.turret) rec.turret.rotation = yawQuat(s[TF.sensor_yaw]);
      const e = threatEntities.get(i);
      if (e.model) {
        e.model.silhouetteSize = tracking ? 2.0 : 0.0;
      }
    }
  }

  buildThreats(scene);

  // ------------------------------------------------------------ aircraft
  // Every aircraft is the fixed-wing model, placed at its simulated position and
  // oriented by its simulated attitude -- heading, flight-path pitch and bank,
  // straight off the airframe state (naigos.demo.attitude). Nothing here derives
  // attitude from motion: a velocity-aligned model would fly every banked turn
  // wings-level.
  const AC_KEY = scene.models.aircraft;
  const acSpec = MODELS[AC_KEY];
  const acFailed = !!modelFailed[AC_KEY];
  const craft = [], trails = [], trailPts = [], objMarks = [];
  const losLines = [], losPts = [], losBlocks = [], dropLines = [], dropPts = [];
  for (let i = 0; i < scene.n_blue; i++) {
    const col = AC_COLORS[i % AC_COLORS.length];
    trailPts.push([]);
    trails.push(viewer.entities.add({
      polyline: {
        positions: new Cesium.CallbackProperty(() => trailPts[i], false),
        width: 2, material: col.withAlpha(0.85), clampToGround: false,
      },
    }));
    craft.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(0, 0, 0),
      // No disableDepthTestDistance: the aircraft must be occluded by terrain.
      // Models are depth-tested against the globe like any primitive; x-ray
      // cannot lift that for a model, so it shows the marker instead.
      model: acFailed ? undefined : {
        uri: acSpec.uri, scale: acSpec.scale,
        minimumPixelSize: acSpec.minimum_pixel_size, maximumScale: acSpec.maximum_scale,
        // Its altitude already went through c3()/exagZ(). CesiumJS 1.145 would
        // otherwise stretch every model vertex by scene.verticalExaggeration as
        // well, putting it at k^2 height and k times taller than it is.
        enableVerticalExaggeration: false,
        color: col, colorBlendMode: Cesium.ColorBlendMode.MIX, colorBlendAmount: 0.55,
        silhouetteColor: col, silhouetteSize: 1.2,
      },
      point: { pixelSize: acFailed ? acSpec.fallback_pixel_size : 7, color: col,
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               show: new Cesium.CallbackProperty(() => acFailed || markersForced(), false) },
      label: { text: `${i}`, font: "bold 10px monospace", fillColor: Cesium.Color.WHITE,
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               style: Cesium.LabelStyle.FILL_AND_OUTLINE,
               pixelOffset: new Cesium.Cartesian2(0, -24), scale: 0.8,
               show: new Cesium.CallbackProperty(() => labelsOn, false) },
      // Replay only: the track drawn from the entity's own sampled positions,
      // so it is the same curve the aircraft is flying rather than a second
      // list that could drift from it. leadTime 0 -- the future is not drawn
      // before it has been played, which is what a scrubbable track means.
      path: { show: false, width: 2, material: col.withAlpha(0.85), leadTime: 0 },
      show: false,
    }));
    losPts.push([]);
    losLines.push(viewer.entities.add({
      polyline: {
        positions: new Cesium.CallbackProperty(() => losPts[i], false),
        width: 1.5, material: Cesium.Color.WHITE.withAlpha(0.5),
      },
      show: false,
    }));
    // Where the ray is pinched: the sample the minimum clearance came from.
    // Drawn only when that minimum is negative, i.e. terrain is cutting the
    // ray -- which is the one moment the overlay exists to make visible.
    losBlocks.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(0, 0, 0),
      point: { pixelSize: 8, color: Cesium.Color.fromCssColorString("#45d17a"),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               disableDepthTestDistance: Number.POSITIVE_INFINITY },
      label: { text: "blocked", font: "bold 9px monospace",
               fillColor: Cesium.Color.fromCssColorString("#45d17a"),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
               style: Cesium.LabelStyle.FILL_AND_OUTLINE,
               pixelOffset: new Cesium.Cartesian2(0, -14), scale: 0.9,
               disableDepthTestDistance: Number.POSITIVE_INFINITY,
               translucencyByDistance: new Cesium.NearFarScalar(3e4, 1.0, 3.0e5, 0.0) },
      show: false,
    }));
    dropPts.push([]);
    dropLines.push(viewer.entities.add({
      polyline: {
        positions: new Cesium.CallbackProperty(() => dropPts[i], false),
        width: 1, material: col.withAlpha(0.35),
      },
      show: false,
    }));
    objMarks.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(0, 0, 0),
      point: { pixelSize: 7, color: Cesium.Color.fromCssColorString("#45d17a").withAlpha(0.8),
               outlineColor: Cesium.Color.BLACK, outlineWidth: 1 },
      show: false,
    }));
  }

  // -------------------------------------------------------------- toggles
  const bindToggle = (id, get, set, arr) => {
    const btn = document.getElementById(id);
    const apply = () => { arr().forEach(e => (e.show = get())); btn.classList.toggle("on", get()); };
    btn.onclick = () => { set(!get()); apply(); };
    apply();
  };
  bindToggle("t-lethal", () => lethalOn, v => (lethalOn = v), () => lethalDomes);
  bindToggle("t-detect", () => detectOn, v => (detectOn = v), () => detectRings);
  // Two implementations of one idea, and the toggle covers both: live pushes
  // positions into a CallbackProperty as they arrive, replay lets the entity
  // draw its own sampled path. `show` means the same thing on either.
  let trailsOn = true;
  bindToggle("t-trails", () => trailsOn, v => (trailsOn = v),
             () => (REPLAY ? craft.map(c => c.path) : trails));
  // Not bindToggle: the block markers are gated on losOn AND on the ray being
  // cut, which drawAircraft re-decides every frame. Turning the layer off has
  // to hide them immediately rather than wait for the next frame to agree.
  let losOn = true;
  const losBtn = document.getElementById("t-los");
  const applyLos = () => {
    losLines.forEach(e => (e.show = losOn));
    if (!losOn) losBlocks.forEach(e => (e.show = false));
    losBtn.classList.toggle("on", losOn);
  };
  losBtn.onclick = () => { losOn = !losOn; applyLos(); };
  applyLos();

  // X-ray: one global knob. 0 = depth test on (aircraft hide behind ridges),
  // huge = always visible. Occlusion is the point, so it defaults to off.
  let xray = false;
  // Depth-testing the overlays against the terrain is the point in physics mode:
  // an aircraft that disappears behind a ridge disappeared in the model too.
  // Against the photorealistic mesh it would be the opposite -- an occlusion the
  // simulation never computed, drawn as though it had, by provider buildings
  // that exist in no model. So that mode never depth-tests, whatever x-ray says.
  const applyDepthTest = () => {
    viewer.scene.minimumDisableDepthTestDistance =
      (xray || visualMode === "photorealistic" || urbanOverlaysOnTop) ? Number.POSITIVE_INFINITY : 0.0;
  };
  const xrayBtn = document.getElementById("t-xray");
  xrayBtn.onclick = () => {
    xray = !xray;
    applyDepthTest();
    dropLines.forEach(e => (e.show = xray));
    xrayBtn.classList.toggle("on", xray);
  };

  // Vertical exaggeration -- 80 km of map against 3 km of relief reads flat from
  // orbit, and the whole point is to see the ridges.
  const shadeBtn = document.getElementById("t-shade");
  let shadeOn = true;
  shadeBtn.onclick = () => {
    shadeOn = !shadeOn;
    if (hillshadeLayer) hillshadeLayer.show = shadeOn;
    shadeBtn.classList.toggle("on", shadeOn);
  };

  // Turning the skin off leaves the relief, the hillshade and every LOS ray
  // exactly where they were -- which is the layer separation made clickable.
  const imgBtn = document.getElementById("t-imagery");
  let imageryOn = true;
  imgBtn.onclick = () => {
    imageryOn = !imageryOn;
    baseLayer.show = imageryOn;
    imgBtn.classList.toggle("on", imageryOn);
  };

  const exagBtn = document.getElementById("t-exag");
  const EXAG = [1, 2, 3];
  let exagIdx = 0;                       // x1: mesh and entities agree by default
  // Set by the replay path below. Sampled tracks cache absolute Cartesians the
  // same way trails do, so they have to be rebuilt on the same trigger --
  // otherwise the relief moves and the aircraft do not.
  let rebuildTracks = null;
  let shadeK = 1;                        // the relief the current hillshade was computed for
  const exagBadge = document.getElementById("exagbadge");
  const applyExag = () => {
    EXAG_K = EXAG[exagIdx];
    viewer.scene.verticalExaggeration = EXAG_K;
    // trails and domes cache absolute positions, so they must be rebuilt
    trailPts.forEach((_, i) => (trailPts[i] = []));
    if (rebuildTracks) rebuildTracks();
    lethalDomes.forEach(d => {
      const r = d.ellipsoid.radii.getValue();
      d.ellipsoid.radii = new Cesium.Cartesian3(r.x, r.y, d._naigosH * EXAG_K);
    });
    // Ground models stand on exagZ(ground) + offset: re-place them on the
    // stretched mesh, or they are left buried (x>1) or floating (back to x1).
    // Replay's threats are sampled and are rebuilt by rebuildTracks above.
    if (!REPLAY) for (const [i, rec] of threatRec) if (rec.last) placeThreat(i, ...rec.last);
    // and the shading follows the relief it shades
    if (hillshadeLayer && shadeK !== EXAG_K) { shadeK = EXAG_K; applyHillshade(EXAG_K); }
    exagBtn.textContent = `relief x${EXAG_K}`;
    exagBtn.classList.toggle("on", EXAG_K !== 1);
    // Opt-in and never silent: while the multiplier is on, the globe says so.
    exagBadge.hidden = EXAG_K === 1;
    exagBadge.textContent = `VERTICAL EXAGGERATION x${EXAG_K} -- relief, aircraft, threats, `
      + "envelopes and LOS rays scaled together for legibility; physics used x1";
  };
  exagBtn.onclick = () => { exagIdx = (exagIdx + 1) % EXAG.length; applyExag(); };
  applyExag();

  // Labels are secondary to the models: on by default, one click away.
  const labelsBtn = document.getElementById("t-labels");
  labelsBtn.onclick = () => { labelsOn = !labelsOn; labelsBtn.classList.toggle("on", labelsOn); };
  // Effects: the visual-event layer (tracers, impacts). Off hides the drawing;
  // the event log keeps listing what the simulation recorded.
  let fxOn = true;
  const fxBtn = document.getElementById("t-fx");
  fxBtn.onclick = () => { fxOn = !fxOn; fxBtn.classList.toggle("on", fxOn); };

  // Camera presets. Follow is the one that needs the aircraft, so it lives here.
  let follow = false;
  const FOLLOW = CAM.follow_aircraft;
  // Replay's tracked-entity offset: behind (south of) and above the aircraft,
  // at the preset's pitch and range, in the entity's east-north-up frame.
  const followOffset = new Cesium.Cartesian3(
    0, -FOLLOW.range_m * Math.cos(Cesium.Math.toRadians(-FOLLOW.pitch_deg)),
    FOLLOW.range_m * Math.sin(Cesium.Math.toRadians(-FOLLOW.pitch_deg)));
  craft.forEach(c => (c.viewFrom = followOffset));
  function setCameraMode(mode) {
    cameraMode = mode;
    follow = mode === "follow_aircraft";
    if (REPLAY) {
      viewer.trackedEntity = follow && !SAFE_FOLLOW
        ? craft.find(c => c.isAvailable(viewer.clock.currentTime)) : undefined;
    } else if (!follow) {
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    }
    frameCamera(mode);
    markCamera();
  }
  document.getElementById("t-overview").onclick = () => setCameraMode("terrain_overview");
  document.getElementById("t-topdown").onclick = () => setCameraMode("top_down_analysis");
  document.getElementById("t-urban").onclick = () => setCameraMode("urban_overview");
  document.getElementById("t-street").onclick = () => setCameraMode("street_canyon");
  document.getElementById("t-follow").onclick = e => {
    // leaving follow returns to the mode's own opening view
    setCameraMode(follow ? (CAM.default === "follow_aircraft" ? "terrain_overview" : CAM.default)
                         : "follow_aircraft");
    // In replay the camera is handed to Cesium's own entity tracking, so it
    // follows the interpolated position continuously instead of snapping to
    // each logged frame. Live keeps the per-frame lookAt in drawAircraft --
    // there is no interpolated position there to follow.
    if (REPLAY) {
